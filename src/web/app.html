<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>labMail</title>
<style>
/* ── Tokens: one accent, a neutral ramp, hairline separators. ─────────────── */
:root {
  --bg:            #ffffff;
  --bg-sidebar:    #f5f5f7;
  --bg-list:       #ffffff;
  --bg-raised:     #fbfbfd;
  --bg-hover:      rgba(0, 0, 0, .04);
  --bg-active:     rgba(0, 0, 0, .07);
  --sel:           #dbeafe;
  --sel-strong:    #2f6fed;
  --sel-text:      #1a3a7a;

  --line:          rgba(0, 0, 0, .10);
  --line-soft:     rgba(0, 0, 0, .06);

  --text:          #1c1c1e;
  --text-2:        #4a4a4f;
  --text-3:        #8a8a8f;

  --accent:        #2f6fed;
  --accent-hover:  #2560d8;
  --accent-soft:   rgba(47, 111, 237, .10);
  --danger:        #d7373f;
  --warn:          #b26a00;
  --ok:            #1f8b4c;

  --r-sm: 5px;
  --r:    7px;
  --r-lg: 11px;

  --shadow-pop: 0 1px 2px rgba(0,0,0,.06), 0 8px 28px rgba(0,0,0,.14);
  --shadow-sm:  0 1px 2px rgba(0,0,0,.05);

  --sidebar-w: 224px;
  --list-w:    370px;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
}

/*
 * Dark palette, declared twice on purpose: once for the system preference and
 * once for an explicit choice. A media query cannot be re-entered from a
 * selector, so the tokens are repeated rather than shared.
 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:         #1c1c1e;
    --bg-sidebar: #232326;
    --bg-list:    #1c1c1e;
    --bg-raised:  #242428;
    --bg-hover:   rgba(255, 255, 255, .055);
    --bg-active:  rgba(255, 255, 255, .10);
    --sel:        #1e3563;
    --sel-strong: #4b8bff;
    --sel-text:   #cfe0ff;

    --line:       rgba(255, 255, 255, .13);
    --line-soft:  rgba(255, 255, 255, .07);

    --text:       #f2f2f5;
    --text-2:     #b8b8be;
    --text-3:     #7c7c83;

    --accent:       #4b8bff;
    --accent-hover: #6b9fff;
    --accent-soft:  rgba(75, 139, 255, .16);
    --danger:       #ff6b6b;
    --warn:         #e5a83b;
    --ok:           #4ec97e;

    --shadow-pop: 0 1px 2px rgba(0,0,0,.5), 0 10px 34px rgba(0,0,0,.55);
    --shadow-sm:  0 1px 2px rgba(0,0,0,.35);
  }
}

:root[data-theme="dark"] {
    --bg:         #1c1c1e;
    --bg-sidebar: #232326;
    --bg-list:    #1c1c1e;
    --bg-raised:  #242428;
    --bg-hover:   rgba(255, 255, 255, .055);
    --bg-active:  rgba(255, 255, 255, .10);
    --sel:        #1e3563;
    --sel-strong: #4b8bff;
    --sel-text:   #cfe0ff;

    --line:       rgba(255, 255, 255, .13);
    --line-soft:  rgba(255, 255, 255, .07);

    --text:       #f2f2f5;
    --text-2:     #b8b8be;
    --text-3:     #7c7c83;

    --accent:       #4b8bff;
    --accent-hover: #6b9fff;
    --accent-soft:  rgba(75, 139, 255, .16);
    --danger:       #ff6b6b;
    --warn:         #e5a83b;
    --ok:           #4ec97e;

    --shadow-pop: 0 1px 2px rgba(0,0,0,.5), 0 10px 34px rgba(0,0,0,.55);
    --shadow-sm:  0 1px 2px rgba(0,0,0,.35);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  /* Column layout so a banner above the app shares the viewport height with it
     rather than pushing the app's bottom edge out of view. */
  display: flex;
  flex-direction: column;
}
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* ── Controls ────────────────────────────────────────────────────────────── */
button {
  font: inherit; color: var(--text); cursor: pointer;
  background: transparent; border: 1px solid transparent;
  border-radius: var(--r-sm); padding: 5px 10px;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .12s ease, border-color .12s ease;
  white-space: nowrap;
}
button:hover:not(:disabled) { background: var(--bg-hover); }
button:active:not(:disabled) { background: var(--bg-active); }
button:disabled { opacity: .4; cursor: default; }

/* A button running slow work says so itself, rather than going inert and
   leaving the operator to guess between "working" and "broken". Kept at full
   opacity: dimming it reads as unavailable, which is the opposite. */
button.busy { opacity: 1; cursor: progress; }
button.busy .spinner { margin-right: 7px; }
.spinner { display: inline-block; width: 12px; height: 12px; vertical-align: -2px;
  border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
  opacity: .75; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2.4s; }
}
button.bordered { border-color: var(--line); background: var(--bg-raised); }
button.bordered:hover:not(:disabled) { background: var(--bg-hover); }
button.primary {
  background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500;
}
button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
button.danger-text { color: var(--danger); }

input, textarea, select {
  font: inherit; color: var(--text); width: 100%;
  background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 7px 10px;
  transition: border-color .12s ease, box-shadow .12s ease;
}
input:focus, textarea:focus, select:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
/* The rule above sets width:100% for text fields; a checkbox that obeys it
   stretches across its row and pushes every sibling out of place. */
input[type=checkbox], input[type=radio] {
  width: auto; flex: none; margin: 0; padding: 0; accent-color: var(--accent);
}

input::placeholder, textarea::placeholder { color: var(--text-3); }
label { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-2);
        margin-bottom: 5px; letter-spacing: .01em; }

.icon { width: 17px; height: 17px; flex: none; stroke-width: 1.6; }
.icon-sm { width: 14px; height: 14px; flex: none; stroke-width: 1.7; }

/* ── Scrollbars: present but quiet ───────────────────────────────────────── */
.scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin;
          scrollbar-color: var(--line) transparent; }
.scroll::-webkit-scrollbar { width: 9px; }
.scroll::-webkit-scrollbar-track { background: transparent; }
.scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px;
  border: 2px solid transparent; background-clip: content-box; }
.scroll::-webkit-scrollbar-thumb:hover { background: var(--text-3);
  border: 2px solid transparent; background-clip: content-box; }

/* ══════════════════ Auth ══════════════════════════════════════════════════ */
#auth { flex: 1; min-height: 0; display: grid; place-items: center; padding: 24px;
        background: var(--bg-sidebar); }
.auth-card {
  width: 100%; max-width: 372px; background: var(--bg);
  border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm); padding: 32px 30px;
}
.auth-mark { width: 40px; height: 40px; border-radius: 10px; background: var(--accent);
  display: grid; place-items: center; margin-bottom: 16px; }
.auth-mark svg { width: 22px; height: 22px; stroke: #fff; stroke-width: 1.8; }
.auth-card h1 { margin: 0 0 3px; font-size: 21px; font-weight: 650; letter-spacing: -.02em; }
.auth-card .sub { margin: 0 0 24px; font-size: 13px; color: var(--text-3); }
.field { margin-bottom: 14px; }
.addr-row { display: flex; align-items: stretch; }
.addr-row input { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.addr-row .suffix {
  display: flex; align-items: center; padding: 0 11px; white-space: nowrap;
  border: 1px solid var(--line); border-left: none; border-radius: 0 var(--r-sm) var(--r-sm) 0;
  background: var(--bg-sidebar); color: var(--text-3); font-size: 12.5px;
}
.auth-switch { margin-top: 18px; text-align: center; font-size: 12.5px; color: var(--text-3); }
.auth-switch button { color: var(--accent); padding: 2px 4px; font-weight: 500; }

.notice { padding: 9px 12px; border-radius: var(--r-sm); font-size: 12.5px;
  white-space: pre-line; word-break: keep-all;
          margin-bottom: 15px; display: flex; gap: 8px; align-items: flex-start; }
.notice.error { background: rgba(215,55,63,.10); color: var(--danger); }
.notice.ok    { background: rgba(31,139,76,.10);  color: var(--ok); }
.notice.warn  { background: rgba(178,106,0,.11);  color: var(--warn); }
.notice.info  { background: var(--bg-hover);      color: var(--text-2); }

/* ══════════════════ Shell ═════════════════════════════════════════════════ */
#app { flex: 1; min-height: 0; display: grid;
       grid-template-columns: var(--sidebar-w) var(--list-w) 1fr; }

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
#sidebar {
  background: var(--bg-sidebar); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
.side-head { padding: 14px 14px 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650;
         font-size: 14.5px; letter-spacing: -.01em; margin-bottom: 13px; }
.brand-mark { width: 21px; height: 21px; border-radius: 5px; background: var(--accent);
  display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 13px; height: 13px; stroke: #fff; stroke-width: 2; }
.side-nav { padding: 0 8px; flex: 1; min-height: 0; }
.nav-item {
  width: 100%; justify-content: flex-start; gap: 9px; padding: 6px 9px;
  border-radius: var(--r-sm); color: var(--text-2); font-size: 13px; margin-bottom: 1px;
}
.nav-item .icon { stroke: currentColor; fill: none; }
.nav-item:hover { background: var(--bg-hover); }
/* The global `button:hover:not(:disabled)` outranks a plain `.nav-item.active`,
   so the selected mailbox lost its highlight under the pointer. */
.nav-item.active,
.nav-item.active:hover { background: var(--accent); color: #fff; font-weight: 500; }
.nav-item.active .badge { background: rgba(255,255,255,.26); color: #fff; }
.nav-label { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; }
.badge { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 9px;
         background: var(--bg-active); color: var(--text-2); min-width: 19px; text-align: center; }
.nav-sep { height: 1px; background: var(--line-soft); margin: 9px 9px; }
.nav-group { font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-3); padding: 4px 10px 5px; }

.side-foot { border-top: 1px solid var(--line-soft); padding: 9px; }
.account { display: flex; align-items: center; gap: 9px; padding: 6px 7px;
  border-radius: var(--r-sm); width: 100%; border: 1px solid transparent; }
.account:hover, .account[aria-expanded="true"] { background: var(--bg-hover); }
.account-text { flex: 1; min-width: 0; text-align: left; }
/* Explicitly block: the row is a button, which sets white-space: nowrap, so
   inline spans would run onto one line and overflow. */
.account-name { display: block; font-size: 12.5px; font-weight: 600; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.account-mail { display: block; font-size: 11px; color: var(--text-3); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }

.avatar {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  display: grid; place-items: center; color: #fff;
  font-size: 11.5px; font-weight: 650; letter-spacing: -.02em; user-select: none;
}
.avatar.lg { width: 36px; height: 36px; font-size: 14px; }

/* ── List pane ───────────────────────────────────────────────────────────── */
#list-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--bg-list); border-right: 1px solid var(--line); }

.list-top { border-bottom: 1px solid var(--line-soft); background: var(--bg-list);
  position: sticky; top: 0; z-index: 5; }
/* The drawer is otherwise unreachable from the list pane on a narrow screen,
   where the reader — which holds the other menu button — is hidden. */
.list-head-row { display: flex; align-items: center; }
.list-head-row .menu-btn { margin: 2px 0 0 8px; flex: none; }
.search-wrap { padding: 10px 12px 8px; position: relative; flex: 1; min-width: 0; }
.search-wrap .icon-sm { position: absolute; left: 22px; top: 50%; transform: translateY(-50%);
  stroke: var(--text-3); pointer-events: none; }
#search { padding-left: 30px; padding-right: 28px; background: var(--bg-sidebar);
  border-color: transparent; font-size: 12.5px; }
#search:focus { background: var(--bg); border-color: var(--accent); }
.search-clear { position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
  padding: 3px; border-radius: 50%; }

.filters { display: flex; gap: 3px; padding: 0 12px 9px; align-items: center; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 20px; color: var(--text-2); }
.chip:hover { background: var(--bg-hover); }
.chip.on,
.chip.on:hover { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.list-count { margin-left: auto; font-size: 11px; color: var(--text-3); }
.select-all { display: flex; align-items: center; margin: 0 4px 0 2px; cursor: pointer; }
.pager { display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 14px 12px 22px; }
.pager button { padding: 3px 11px; font-size: 14px; line-height: 1.2; }
.pager .help { margin-top: 0; }
.empty-trash { display: flex; justify-content: flex-end; padding: 8px 12px 0; }

/* Bulk-selection toolbar replaces the filter row while rows are selected. */
.bulkbar { display: flex; align-items: center; gap: 3px; padding: 5px 8px 9px 12px; }
.bulkbar .count { font-size: 12.5px; font-weight: 600; margin-right: auto; }
.bulkbar button { padding: 5px 7px; }
.bulkbar .icon { stroke: currentColor; fill: none; }

#list { flex: 1; min-height: 0; }
.date-sep {
  position: sticky; top: 0; z-index: 2;
  padding: 6px 16px 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-3);
  background: color-mix(in srgb, var(--bg-list) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line-soft);
}

.row {
  position: relative; display: flex; gap: 10px; padding: 9px 14px 10px 8px;
  cursor: default; border-bottom: 1px solid var(--line-soft);
  scroll-margin: 60px;
}
.row:hover { background: var(--bg-hover); }
.row.selected { background: var(--sel); }
.row.selected .row-preview, .row.selected .row-time { color: var(--sel-text); opacity: .78; }
.row.selected .row-from, .row.selected .row-subject { color: var(--sel-text); }
.row.checked { background: var(--accent-soft); }

/* Unread marker, swapped for a checkbox on hover or in selection mode. */
.row-gutter { width: 20px; flex: none; display: flex; flex-direction: column;
  align-items: center; padding-top: 4px; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.row:not(.unread) .dot { visibility: hidden; }
.row-check { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--text-3);
  display: none; place-items: center; cursor: pointer; flex: none; background: var(--bg); }
.row-check svg { width: 11px; height: 11px; stroke: #fff; stroke-width: 3; display: none; }
.row-check.on { background: var(--accent); border-color: var(--accent); }
.row-check.on svg { display: block; }
.row:hover .row-check, .selecting .row-check { display: grid; }
.row:hover .dot, .selecting .dot { display: none; }

.row-body { flex: 1; min-width: 0; }
.row-line { display: flex; align-items: baseline; gap: 8px; }
.row-from { font-size: 13px; font-weight: 600; letter-spacing: -.005em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.unread .row-from { font-weight: 700; }
.row-time { margin-left: auto; font-size: 11px; color: var(--text-3); flex: none; }
.row-subject { font-size: 12.5px; margin-top: 1px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.row.unread .row-subject { font-weight: 600; }
.row-preview { font-size: 12px; color: var(--text-3); margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { display: flex; align-items: center; gap: 5px; margin-top: 4px; }
.thread-pill { font-size: 10.5px; font-weight: 600; color: var(--text-3);
  border: 1px solid var(--line); border-radius: 9px; padding: 0 5px; }
.row-star { padding: 2px; border-radius: 4px; opacity: 0; transition: opacity .12s; }
.row:hover .row-star, .row-star.on { opacity: 1; }
.row-star svg { width: 14px; height: 14px; stroke: var(--text-3); fill: none; stroke-width: 1.7; }
.row-star.on svg { stroke: #e8a33d; fill: #e8a33d; }
.attach-mark svg { width: 12px; height: 12px; stroke: var(--text-3); fill: none; }

.load-more { padding: 14px; display: grid; place-items: center; }

/* ── Reader ──────────────────────────────────────────────────────────────── */
#reader { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.reader-bar {
  display: flex; align-items: center; gap: 2px; padding: 8px 12px;
  border-bottom: 1px solid var(--line-soft); min-height: 45px;
}
.reader-bar .icon { stroke: currentColor; fill: none; }
.bar-sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; }
.bar-back { display: none; }

.reader-scroll { flex: 1; min-height: 0; }
.thread-head { padding: 20px 26px 14px; border-bottom: 1px solid var(--line-soft); }
.thread-subject { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.02em;
  line-height: 1.32; word-break: break-word; }
.thread-meta { margin-top: 6px; font-size: 12px; color: var(--text-3); }

/* Conversation message. Collapsed rows show a one-line summary. */
.msg { border-bottom: 1px solid var(--line-soft); }
.msg-head { display: flex; gap: 11px; padding: 14px 26px; cursor: pointer; align-items: flex-start; }
.msg-head:hover { background: var(--bg-hover); }
.msg.expanded > .msg-head { cursor: default; }
.msg.expanded > .msg-head:hover { background: transparent; }
.msg-who { flex: 1; min-width: 0; }
.msg-name { font-size: 13.5px; font-weight: 650; }
.msg-addr { font-size: 12px; color: var(--text-3); }
.msg-to { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
.msg-collapsed-preview { font-size: 12.5px; color: var(--text-3); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.msg-time { font-size: 11.5px; color: var(--text-3); flex: none; white-space: nowrap; padding-top: 2px; }
.msg-body { padding: 0 26px 22px; }
.msg-text { white-space: pre-wrap; word-break: break-word; font-size: 13.5px; line-height: 1.62; }
.msg-text a { color: var(--accent); }
.msg-frame { width: 100%; min-height: 360px; border: 0; background: transparent; display: block; }

.quote-toggle { margin: 10px 0 0; padding: 1px 8px; border-radius: 10px;
  background: var(--bg-active); color: var(--text-3); font-size: 14px; line-height: 1.2; }

.attach-strip { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 26px 0; }
.attach {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  border: 1px solid var(--line); border-radius: var(--r); padding: 7px 11px;
  background: var(--bg-raised); color: var(--text); font-size: 12px; max-width: 260px;
}
.attach:hover { background: var(--bg-hover); }
.attach svg { stroke: var(--text-3); fill: none; flex: none; }
.attach-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attach-size { color: var(--text-3); font-size: 11px; flex: none; }

/* The body frame fills the pane, so a dock that merely follows it in flow ends
   up below the fold on every message. Pinned to the foot of the scroller it
   stays one click away regardless of body height. */
.reply-dock { padding: 14px 26px 20px; display: flex; gap: 8px;
  position: sticky; bottom: 0; background: var(--bg);
  border-top: 1px solid var(--line-soft); }

/* ── States ──────────────────────────────────────────────────────────────── */
.state { display: grid; place-items: center; height: 100%; padding: 40px 28px; text-align: center; }
/* keep-all, or Korean breaks mid-word: "관리자에게 문의하 / 세요". The width is
   set so the longest of these messages lands on two lines rather than three. */
.state-inner { max-width: 340px; word-break: keep-all; }
.state svg { width: 40px; height: 40px; stroke: var(--text-3); fill: none;
  stroke-width: 1.2; margin-bottom: 14px; opacity: .65; }
.state h3 { margin: 0 0 5px; font-size: 14.5px; font-weight: 600; color: var(--text-2); }
.state p { margin: 0; font-size: 12.5px; color: var(--text-3); line-height: 1.55;
  white-space: pre-line; }
.state .actions { margin-top: 16px; display: flex; gap: 8px; justify-content: center; }

.skeleton { padding: 11px 14px 12px 34px; border-bottom: 1px solid var(--line-soft); }

.mono { font-family: var(--mono); font-size: 11.5px; }
.help { font-size: 11.5px; color: var(--text-3); margin-top: 5px; line-height: 1.5;

.cat-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; margin: 0 3px; }

.cat-row { display: flex; align-items: center; gap: 10px; padding: 9px 0;

<!-- ══ Auth ══════════════════════════════════════════════════════════════ -->
<div id="auth">
  <div class="auth-card">
    <div class="auth-mark"><svg viewBox="0 0 24 24"><use href="#i-mail"/></svg></div>
    <h1>labMail</h1>
    <p class="sub" id="auth-sub" data-i18n="auth.subtitle"></p>
    <div id="auth-notice"></div>

    <form id="form-login" novalidate>
      <div class="field">
        <label for="li-user" data-i18n="auth.identifier"></label>
        <input id="li-user" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="li-pass" data-i18n="auth.password"></label>
        <input id="li-pass" type="password" autocomplete="current-password" required>
      </div>
      <button class="primary" type="submit" style="width:100%;justify-content:center;padding:9px"
              data-i18n="auth.signIn"></button>
      <div class="auth-switch"><span data-i18n="auth.noAccount"></span>
        <button type="button" id="go-signup" data-i18n="auth.signUp"></button></div>
    </form>

    <form id="form-signup" class="hidden" novalidate>
      <div class="field">
        <label for="su-name" data-i18n="auth.name"></label>
        <input id="su-name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="su-local" data-i18n="auth.desiredAddress"></label>
        <div class="addr-row">
          <input id="su-local" placeholder="hong" autocomplete="username"
                 autocapitalize="off" spellcheck="false" required>
          <span class="suffix" id="su-suffix"></span>
          <select id="su-domain" class="hidden" aria-label="domain"></select>
        </div>
        <div class="help" id="su-local-msg"></div>
      </div>
      <div class="field">
        <label for="su-pass"><span data-i18n="auth.password"></span>
          <span style="font-weight:400;color:var(--text-3)" data-i18n="auth.passwordHint"></span></label>
        <input id="su-pass" type="password" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="su-pass2" data-i18n="auth.passwordConfirm"></label>
        <input id="su-pass2" type="password" autocomplete="new-password" required>
        <div class="help" id="su-pass-msg"></div>
      </div>
      <button class="primary" type="submit" style="width:100%;justify-content:center;padding:9px"
              data-i18n="auth.signUp"></button>
      <div class="auth-switch"><span data-i18n="auth.haveAccount"></span>
        <button type="button" id="go-login" data-i18n="auth.signIn"></button></div>
    </form>
  </div>
</div>

<!-- ══ App ═══════════════════════════════════════════════════════════════ -->
<div id="app" class="hidden">

  <nav id="sidebar" data-i18n-aria-label="list.sidebarAria">
    <div class="side-head">
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24"><use href="#i-mail"/></svg></span>
        labMail
      </div>
      <button class="primary" id="btn-compose" style="width:100%;justify-content:center;padding:7px">
        <svg class="icon-sm" viewBox="0 0 24 24" style="stroke:#fff;fill:none"><use href="#i-send"/></svg>
        <span data-i18n="nav.compose"></span>
      </button>
    </div>

    <div class="side-nav scroll">
      <button class="nav-item active" data-mailbox="inbox">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-inbox"/></svg>
        <span class="nav-label" data-i18n="nav.inbox"></span><span class="badge hidden" data-count="unread"></span>
      </button>
      <button class="nav-item" data-mailbox="sent">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-send"/></svg>
        <span class="nav-label" data-i18n="nav.sent"></span>
      </button>
      <button class="nav-item" data-mailbox="archive">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-archive"/></svg>
        <span class="nav-label" data-i18n="nav.archive"></span>
      </button>
      <button class="nav-item" data-mailbox="drafts">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-draft"/></svg>
        <span class="nav-label" data-i18n="nav.drafts"></span><span class="badge hidden" data-count="drafts"></span>
      </button>
      <button class="nav-item" data-mailbox="spam">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-spam"/></svg>
        <span class="nav-label" data-i18n="nav.spam"></span><span class="badge hidden" data-count="spam"></span>
      </button>
      <button class="nav-item" data-mailbox="trash">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-trash"/></svg>
        <span class="nav-label" data-i18n="nav.trash"></span>
      </button>

      <div id="nav-categories" class="hidden">
        <div class="nav-sep"></div>
        <div class="nav-group" data-i18n="nav.categories"></div>
        <div id="category-list"></div>
      </div>

      <div class="nav-sep"></div>
      <button class="nav-item" data-view="drive">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-folder"/></svg>
        <span class="nav-label" data-i18n="nav.files"></span>
      </button>

      <div id="admin-nav" class="hidden">
        <div class="nav-sep"></div>
        <div class="nav-group" data-i18n="nav.adminGroup"></div>
        <button class="nav-item" data-view="members">
          <svg class="icon" viewBox="0 0 24 24"><use href="#i-users"/></svg>
          <span class="nav-label" data-i18n="nav.members"></span><span class="badge hidden" id="pending-badge"></span>
        </button>
        <button class="nav-item" data-view="unassigned">
          <svg class="icon" viewBox="0 0 24 24"><use href="#i-inbox-down"/></svg>
          <span class="nav-label" data-i18n="nav.unassigned"></span>
          <span class="badge hidden" id="unassigned-badge"></span>
        </button>
        <button class="nav-item" data-view="audit">
          <svg class="icon" viewBox="0 0 24 24"><use href="#i-check"/></svg>
          <span class="nav-label" data-i18n="nav.audit"></span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg class="icon" viewBox="0 0 24 24"><use href="#i-gear"/></svg>
          <span class="nav-label" data-i18n="nav.settings"></span>
        </button>
      </div>
    </div>

    <div class="side-foot">
      <button class="account" id="btn-account" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar" id="me-avatar"></span>
        <span class="account-text">
          <span class="account-name" id="me-name"></span>
          <span class="account-mail" id="me-mail"></span>
        </span>
        <svg class="icon-sm" viewBox="0 0 24 24" style="stroke:var(--text-3);fill:none"><use href="#i-chevron"/></svg>
      </button>
    </div>
  </nav>

  <section id="list-pane" data-i18n-aria-label="list.listAria">
    <div class="list-top">
      <div class="list-head-row">
        <button class="menu-btn" id="btn-menu-list" data-i18n-aria-label="nav.menu">
          <svg class="icon" viewBox="0 0 24 24" style="stroke:currentColor;fill:none"><use href="#i-menu"/></svg>
        </button>
        <div class="search-wrap">
          <svg class="icon-sm" viewBox="0 0 24 24"><use href="#i-search"/></svg>
          <input id="search" type="search" data-i18n-placeholder="list.search" autocomplete="off" spellcheck="false">
          <button class="search-clear hidden" id="search-clear" data-i18n-aria-label="list.clearSearch">
            <svg class="icon-sm" viewBox="0 0 24 24" style="stroke:var(--text-3);fill:none"><use href="#i-close"/></svg>
          </button>
        </div>
      </div>
      <div class="filters" id="filters">
        <label class="select-all" id="select-all-wrap" data-i18n-title="list.selectPage">
          <input type="checkbox" id="select-all">
        </label>
        <button class="chip on" data-filter="all" data-i18n="list.filterAll"></button>
        <button class="chip" data-filter="unread" data-i18n="list.filterUnread"></button>
        <button class="chip" data-filter="starred" data-i18n="list.filterStarred"></button>
        <span class="list-count" id="list-count"></span>
      </div>
      <div class="bulkbar hidden" id="bulkbar">
        <label class="select-all" data-i18n-title="list.selectPage">

<script type="module">
'use strict'
const $  = (id) => document.getElementById(id)
const el = (tag, cls, text) => {
  const n = document.createElement(tag)
  if (cls) n.className = cls
  if (text != null) n.textContent = text
  return n
}
const icon = (name, cls = 'icon') => {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('viewBox', '0 0 24 24')
  svg.setAttribute('class', cls)
  svg.style.stroke = 'currentColor'
  svg.style.fill = 'none'
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use')
  use.setAttribute('href', `#i-${name}`)
  svg.appendChild(use)
  return svg
}

const LOCALE_COOKIE = 'labmail_lang'
const LOCALES = Object.keys(STRINGS)
const LOCALE_LABEL = { ko: '한국어', en: 'English' }
const BCP47 = { ko: 'ko-KR', en: 'en-US' }

function readLocaleCookie() {
  const hit = document.cookie.split(';')
    .map((c) => c.trim().split('='))
    .find(([k]) => k === LOCALE_COOKIE)
  return hit ? decodeURIComponent(hit[1] || '') : null
}

function pickInitialLocale() {
  const stored = readLocaleCookie()
  if (LOCALES.includes(stored)) return stored
  for (const tag of navigator.languages || [navigator.language || '']) {
    const base = String(tag).toLowerCase().split('-')[0]
    if (LOCALES.includes(base)) return base
  }
  return 'ko'
}

let LOCALE = pickInitialLocale()

/** Translate a key, substituting {name} placeholders. */
function t(key, params) {
  const table = STRINGS[LOCALE] || STRINGS.ko
  const template = table[key] ?? STRINGS.ko[key] ?? key
  if (!params) return template
  return template.replace(/\{(\w+)\}/g, (_, name) =>
    params[name] === undefined ? `{${name}}` : String(params[name]))
}

/** Apply translations to markup annotated with data-i18n attributes. */
function translateStatic(root = document) {
  root.querySelectorAll('[data-i18n]').forEach((node) => {
    node.textContent = t(node.dataset.i18n)
  })
  for (const attr of ['placeholder', 'title', 'aria-label']) {
    root.querySelectorAll(`[data-i18n-${attr}]`).forEach((node) => {
      node.setAttribute(attr, t(node.dataset[
        attr === 'aria-label' ? 'i18nAriaLabel' : `i18n${attr[0].toUpperCase()}${attr.slice(1)}`
      ]))
    })
  }
  document.documentElement.lang = LOCALE
}

/**
 * Switch language.
 *
 * The cookie is what the server reads when translating an error, so it is set
 * before the interface re-renders.
 */
async function setLocale(next) {
  if (!LOCALES.includes(next) || next === LOCALE) return
  LOCALE = next
  document.cookie = `${LOCALE_COOKIE}=${next}; Path=/; Max-Age=${365 * 86400}; SameSite=Lax`
  try { await api('/api/locale', { method: 'POST', body: JSON.stringify({ locale: next }) }) }
  catch { /* the cookie already carries the choice */ }
  translateStatic()
  paintLanguageButtons()
  applyTheme()
  rerenderAll()
}

/** Re-render every view that holds translated text. */
function rerenderAll() {
  if (!S.me) return
  $('me-mail').textContent = S.me.alias || t('settings.secretUnset')
  paintCounts()
  if (S.view === 'members') { renderMembers(); return }
  if (S.view === 'settings') { renderSettings(); return }
  if (S.view === 'profile') { renderProfile(); return }
  if (S.view === 'drive') { renderDrive(driveState.folderId); return }
  renderList()
  if (S.openId && S.thread) renderThread(S.openId)
  else showReaderPlaceholder()
}

const localeTag = () => BCP47[LOCALE] || 'en-US'

// ══ Appearance ══════════════════════════════════════════════════════════════
const THEME_KEY = 'labmail:theme'
// Cycles through the three states a reader expects: follow the system, force
// light, force dark.
const THEMES = ['system', 'light', 'dark']
const THEME_GLYPH = { system: 'i-auto', light: 'i-sun', dark: 'i-moon' }
const THEME_LABEL = { system: 'theme.system', light: 'theme.light', dark: 'theme.dark' }

function readTheme() {
  try {
    const stored = localStorage.getItem(THEME_KEY)
    return THEMES.includes(stored) ? stored : 'system'
  } catch { return 'system' }
}

let THEME = readTheme()

/** True when the interface is currently rendering dark, whatever the reason. */
const isDark = () => THEME === 'dark'
  || (THEME === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)

function applyTheme() {
  const root = document.documentElement
  if (THEME === 'system') root.removeAttribute('data-theme')
  else root.setAttribute('data-theme', THEME)

  for (const [glyphId, buttonId] of [['theme-glyph', 'btn-theme'], ['theme-glyph2', 'btn-theme2']]) {
    document.getElementById(glyphId)?.setAttribute('href', `#${THEME_GLYPH[THEME]}`)
    const button = document.getElementById(buttonId)
    if (button) button.title = `${t('theme.toggle')}: ${t(THEME_LABEL[THEME])}`
  }
  // Message bodies render inside an iframe with their own colours.
  if (S.openId && S.thread) renderThread(S.openId)
}

function cycleTheme() {
  THEME = THEMES[(THEMES.indexOf(THEME) + 1) % THEMES.length]
  try { localStorage.setItem(THEME_KEY, THEME) } catch { /* private mode */ }
  applyTheme()
  toast(t(THEME_LABEL[THEME]))
}

// Following the system means following it as it changes.
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (THEME === 'system') applyTheme()
})

function paintLanguageButtons() {
  for (const id of ['lang-code', 'lang-code2']) {
    const node = document.getElementById(id)
    if (node) node.textContent = LOCALE.toUpperCase()
  }
}

/** Two locales, so the control is a toggle rather than a menu. */
const cycleLocale = () => setLocale(LOCALES[(LOCALES.indexOf(LOCALE) + 1) % LOCALES.length])

// ══ HTTP ════════════════════════════════════════════════════════════════
async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: options.body ? { 'content-type': 'application/json' } : {},
    ...options,
  })
  const data = await res.json().catch(() => ({}))
  if (!res.ok) {
    throw Object.assign(new Error(data.error || t('error.requestFailed', { status: res.status })),
      { status: res.status })
  }
  return data
}
