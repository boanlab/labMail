/**
 * A toast whose label counts down, for the undo window.
 *
 * The message is already held server-side; this only tells the member how long
 * they have left and offers the recall.
 */
function countdownToast(seconds, onUndo) {
  const node = el('div', 'toast')
  const label = el('span', null, t('toast.sentWithUndo', { n: seconds }))
  const action = el('button', null, t('toast.undo'))
  node.append(label, action)
  $('toasts').appendChild(node)

  let left = seconds
  const tick = setInterval(() => {
    left -= 1
    if (left <= 0) { clearInterval(tick); node.remove(); return }
    label.textContent = t('toast.sentWithUndo', { n: left })
  }, 1000)

  action.onclick = () => { clearInterval(tick); node.remove(); onUndo() }
  return node
}

// ══ Dialogs ═════════════════════════════════════════════════════════════
/**
 * In-app confirm, prompt and alert. The browser's own announce the origin,
 * cannot be translated, and read as a security prompt rather than part of the
 * app. Promise-returning, focus-trapping, dismissed by Escape or the backdrop.
 */
function openDialog({ title, message, kind = 'confirm', value = '', danger = false, confirmLabel }) {
  return new Promise((resolve) => {
    const previous = document.activeElement
    const scrim = el('div', 'dialog-scrim')
    const box = el('div', 'dialog')
    box.setAttribute('role', kind === 'alert' ? 'alertdialog' : 'dialog')
    box.setAttribute('aria-modal', 'true')

    if (title) box.appendChild(el('div', 'dialog-title', title))
    // pre-line, because these messages carry their own line breaks.
    if (message) box.appendChild(el('div', 'dialog-body', message))

    let field = null
    if (kind === 'prompt') {
      field = el('input')
      field.value = value
      box.appendChild(field)
    }

    const bar = el('div', 'dialog-actions')
    const done = (result) => {
      document.removeEventListener('keydown', onKey, true)
      scrim.remove()
      if (previous instanceof HTMLElement) previous.focus()
      resolve(result)
    }

    if (kind !== 'alert') {
      const cancel = el('button', 'bordered', t('dialog.cancel'))
      cancel.onclick = () => done(kind === 'prompt' ? null : false)
      bar.appendChild(cancel)
    }
    const ok = el('button', danger ? 'primary danger-bg' : 'primary',
      confirmLabel || t(kind === 'alert' ? 'dialog.close' : 'dialog.confirm'))
    ok.onclick = () => done(kind === 'prompt' ? field.value : true)
    bar.appendChild(ok)
    box.appendChild(bar)

    const onKey = (e) => {
      if (e.key === 'Escape') {
        e.preventDefault(); e.stopPropagation()
        done(kind === 'prompt' ? null : kind === 'alert' ? undefined : false)
      } else if (e.key === 'Enter' && (kind !== 'prompt' || document.activeElement === field)) {
        e.preventDefault(); e.stopPropagation()
        ok.click()
      } else if (e.key === 'Tab') {
        // Focus stays inside: a dialog the keyboard can walk out of is not one.
        const focusable = box.querySelectorAll('button, input')
        const first = focusable[0]
        const last = focusable[focusable.length - 1]
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus() }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus() }
      }
    }
    document.addEventListener('keydown', onKey, true)
    scrim.onclick = (e) => { if (e.target === scrim && kind !== 'alert') done(kind === 'prompt' ? null : false) }

    scrim.appendChild(box)
    document.body.appendChild(scrim)
    ;(field ?? ok).focus()
    field?.select()
  })
}

const askConfirm = (message, opts = {}) => openDialog({ message, kind: 'confirm', ...opts })
const askPrompt = (message, value = '', opts = {}) =>
  openDialog({ message, value, kind: 'prompt', ...opts })
const showAlert = (message, opts = {}) => openDialog({ message, kind: 'alert', ...opts })

function toast(text, actionLabel, onAction) {
  const node = el('div', 'toast')
  node.append(el('span', null, text))
  if (actionLabel) {
    const b = el('button', null, actionLabel)
    b.onclick = () => { node.remove(); onAction?.() }
    node.appendChild(b)
  }
  $('toasts').appendChild(node)
  setTimeout(() => node.remove(), actionLabel ? 6000 : 3200)
}

/**
 * Run slow work with the button as its own progress indicator. A button that
 * merely goes disabled cannot be told from one that failed silently.
 *
 * Label and disabled state are restored even when the work throws.
 */
/**
 * Whether this member's address can appear as From. False until an operator
 * adds the send-as entry, so the entry points are withheld rather than left to
 * fail at the server.
 */
const canSend = () => S.me?.canSend !== false

/** Reflect the current send gate on the one button that is not re-rendered. */
function paintSendGate() {
  const button = $('btn-compose')
  if (!button) return
  const blocked = !canSend()
  button.disabled = blocked
  if (blocked) button.title = t('mailbox.sendNotReady')
  else button.removeAttribute('title')
}

/** Disable a send entry point, saying why, while sending is unavailable. */
function gateSend(button) {
  if (canSend()) return button
  button.disabled = true
  button.title = t('mailbox.sendNotReady')
  return button
}

async function withBusy(button, busyLabel, work) {
  const label = button.textContent
  const wasDisabled = button.disabled
  button.disabled = true
  button.classList.add('busy')
  button.textContent = ''
  button.append(el('span', 'spinner'), document.createTextNode(busyLabel || label))
  try {
    return await work()
  } finally {
    button.classList.remove('busy')
    button.disabled = wasDisabled
    button.textContent = label
  }
}

function notice(host, text, kind = 'error') {
  host.innerHTML = ''
  if (!text) return
  const n = el('div', `notice ${kind}`)
  n.append(el('span', null, text))
  host.appendChild(n)
}

/** Stable per-address colour. */
const AVATAR_HUES = [212, 259, 340, 12, 32, 152, 190, 280]
function avatarFor(nameOrAddr, address, size) {
  const key = (address || nameOrAddr || '?').toLowerCase()
  let hash = 0
  for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0
  const hue = AVATAR_HUES[hash % AVATAR_HUES.length]
  const node = el('span', size === 'lg' ? 'avatar lg' : 'avatar')
  node.style.background = `hsl(${hue} 62% 47%)`
  const source = (nameOrAddr || address || '?').trim()
  // Hangul: one leading character. Latin: the familiar two-letter form.
  const initials = /^[A-Za-z]/.test(source)
    ? source.split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase()
    : source[0] || '?'
  node.textContent = initials
  return node
}

const DAY = 86400000
function startOfDay(ms) { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime() }

function shortTime(ms) {
  const today = startOfDay(Date.now())
  const day = startOfDay(ms)
  const d = new Date(ms)
  const tag = localeTag()
  if (day === today) return d.toLocaleTimeString(tag, { hour: 'numeric', minute: '2-digit' })
  if (day === today - DAY) return t('date.yesterday')
  if (today - day < 7 * DAY) return d.toLocaleDateString(tag, { weekday: 'short' })
  if (d.getFullYear() === new Date().getFullYear()) {
    return d.toLocaleDateString(tag, { month: 'numeric', day: 'numeric' })
  }
  return d.toLocaleDateString(tag, { year: '2-digit', month: 'numeric', day: 'numeric' })
}

function dateGroup(ms) {
  const today = startOfDay(Date.now())
  const day = startOfDay(ms)
  if (day === today) return t('date.today')
  if (day === today - DAY) return t('date.yesterday')
  if (today - day < 7 * DAY) return t('date.thisWeek')
  if (today - day < 30 * DAY) return t('date.thisMonth')
  return new Date(ms).toLocaleDateString(localeTag(), { year: 'numeric', month: 'long' })
}

function fullTime(ms) {
  return new Date(ms).toLocaleString(localeTag(),
    { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short', hour: 'numeric', minute: '2-digit' })
}

const displayName = (m) => m.fromName || m.from.split('@')[0] || m.from
const formatSize = (bytes) => bytes < 1024 ? `${bytes} B`
  : bytes < 1048576 ? `${Math.round(bytes / 1024)} KB`
  // Drive quotas run to tens of gigabytes, so the ladder has to reach that far.
  : bytes < 1073741824 ? `${(bytes / 1048576).toFixed(1)} MB`
  : `${(bytes / 1073741824).toFixed(1)} GB`

/** Split a plain-text body from its quoted history, for folding. */
function splitQuote(text) {
  if (!text) return { body: '', quote: '' }
  const lines = text.split('\n')
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i]
    const isQuoteStart = /^>/.test(line)
      || /^-{2,}\s*(Original Message|원본 메시지)/i.test(line)
      || /작성:$/.test(line.trim())
      || /^On .+ wrote:$/.test(line.trim())
    if (isQuoteStart && i > 0) {
      return { body: lines.slice(0, i).join('\n').trimEnd(), quote: lines.slice(i).join('\n') }
    }
  }
  return { body: text, quote: '' }
}

// ══ Empty / loading states ══════════════════════════════════════════════
function stateBlock(iconName, title, detail, actions) {
  const wrap = el('div', 'state')
  const inner = el('div', 'state-inner')
  inner.appendChild(icon(iconName, ''))
  inner.appendChild(el('h3', null, title))
  if (detail) inner.appendChild(el('p', null, detail))
  if (actions?.length) {
    const bar = el('div', 'actions')
    for (const a of actions) {
      const b = el('button', a.primary ? 'primary' : 'bordered', a.label)
      b.onclick = a.onClick
      bar.appendChild(b)
    }
    inner.appendChild(bar)
  }
  wrap.appendChild(inner)
  return wrap
}

function skeletonList(n = 8) {
  const frag = document.createDocumentFragment()
  for (let i = 0; i < n; i++) {
    const s = el('div', 'skeleton')
    const a = el('div', 'sk'); a.style.width = `${38 + (i % 3) * 12}%`
    const b = el('div', 'sk'); b.style.width = `${62 + (i % 4) * 8}%`
    const c = el('div', 'sk'); c.style.width = `${48 + (i % 5) * 9}%`; c.style.marginBottom = '0'
    s.append(a, b, c)
    frag.appendChild(s)
  }
  return frag
}

// ══ Mail list ═══════════════════════════════════════════════════════════
async function loadList({ append = false, keepPage = false } = {}) {
  if (S.loading) return
  S.loading = true
  if (!append) {
    if (!keepPage) S.offset = 0
    S.checked.clear()
    syncBulkBar()
    $('list').innerHTML = ''
    $('list').appendChild(skeletonList())
  }

  try {
    const params = new URLSearchParams({ limit: String(PAGE), offset: String(S.offset) })
    if (S.query) params.set('q', S.query)
    else {
      params.set('mailbox', S.mailbox)
      params.set('filter', S.filter)
      if (S.mailbox === 'category' && S.categoryId) params.set('categoryId', String(S.categoryId))
    }

    const data = await api(`/api/messages?${params}`)
    S.messages = append ? [...S.messages, ...data.messages] : data.messages
    S.hasMore = Boolean(data.hasMore)
    if (data.counts) { S.counts = data.counts; paintCounts() }
    renderList()
  } catch (err) {
    $('list').innerHTML = ''
    $('list').appendChild(stateBlock('empty', t('state.listFailed'), err.message,
      [{ label: t('state.retry'), primary: true, onClick: () => loadList() }]))
  } finally {
    S.loading = false
  }
}

function emptyListState() {
  if (S.query) {
    return stateBlock('search', t('state.searchEmptyTitle'),
      t('state.searchEmptyBody', { q: S.query }),
      [{ label: t('state.clearSearch'), onClick: clearSearch }])
  }
  if (S.filter === 'unread') return stateBlock('check', t('state.allReadTitle'), t('state.allReadBody'))
  if (S.filter === 'starred') return stateBlock('star', t('state.noStarredTitle'), t('state.noStarredBody'))
  if (!S.connected) {
    return stateBlock('plug', t('state.notConnectedTitle'),
      t(S.me?.isAdmin ? 'state.notConnectedAdmin' : 'state.notConnectedMember'),
      S.me?.isAdmin ? [{ label: t('state.openSettings'), primary: true, onClick: () => openView('settings') }] : [])
  }
  if (S.mailbox === 'spam') {
    return stateBlock('not-spam', t('state.emptySpam'), t('state.spamBody'))
  }
  if (S.mailbox === 'drafts') {
    return stateBlock('draft', t('state.emptyDrafts'), t('state.draftsBody'))
  }
  const keys = { inbox: 'state.emptyInbox', sent: 'state.emptySent',
                 archive: 'state.emptyArchive', trash: 'state.emptyTrash' }
  return stateBlock('inbox', t(keys[S.mailbox] || 'state.emptyGeneric'), t('state.emptyBody'))
}

function renderList() {
  const list = $('list')
  list.innerHTML = ''
  $('list-count').textContent = S.messages.length
    ? t('list.count', { n: `${S.messages.length}${S.hasMore ? '+' : ''}` })
    : ''

  if (S.mailbox === 'trash' && S.messages.length > 0) {
    const bar = el('div', 'empty-trash')
    const btn = el('button', 'bordered danger-text', t('list.emptyTrash'))
    btn.onclick = async () => {
      if (!await askConfirm(t('list.emptyTrashConfirm'), { danger: true })) return
      btn.disabled = true
      try {
        const r = await api('/api/messages/empty-trash', { method: 'POST' })
        toast(t('toast.trashEmptied', { n: r.removed }))
        S.offset = 0
        clearChecks()
        if (S.openId) showReaderPlaceholder()
        await loadList()
      } catch (err) { toast(err.message); btn.disabled = false }
    }
    bar.appendChild(btn)
    list.appendChild(bar)
  }

  if (S.messages.length === 0) { list.appendChild(emptyListState()); return }

  const frag = document.createDocumentFragment()
  let group = null
  S.messages.forEach((msg, index) => {
    // Chronological lists only, not search results.
    if (!S.query) {
      const g = dateGroup(msg.date)
      if (g !== group) { group = g; frag.appendChild(el('div', 'date-sep', g)) }
    }
    frag.appendChild(renderRow(msg, index))
  })
  list.appendChild(frag)

  // Paged rather than appended, so "select all" means the same thing every
  // time it is pressed.
  if (S.hasMore || S.offset > 0) list.appendChild(renderPager())
}

function renderPager() {
  const wrap = el('div', 'pager')
  const page = Math.floor(S.offset / PAGE) + 1
  const from = S.messages.length ? S.offset + 1 : 0
  const to = S.offset + S.messages.length

  const prev = el('button', 'bordered', '‹')
  prev.title = t('list.prevPage')
  prev.disabled = S.offset === 0
  prev.onclick = () => goToPage(page - 1)

  const next = el('button', 'bordered', '›')
  next.title = t('list.nextPage')
  next.disabled = !S.hasMore
  next.onclick = () => goToPage(page + 1)

  wrap.append(prev, el('span', 'help', t('list.range', { from, to })), next)
  return wrap
}

function goToPage(page) {
  S.offset = Math.max(0, (page - 1) * PAGE)
  clearChecks()
  loadList()
  $('list').scrollTop = 0
}

function renderRow(msg, index) {
  const row = el('div', 'row')
  row.dataset.id = msg.id
  row.dataset.index = String(index)
  row.setAttribute('role', 'option')
  if (msg.unread) row.classList.add('unread')
  if (msg.id === S.openId) row.classList.add('selected')
  if (S.checked.has(msg.id)) row.classList.add('checked')
  row.setAttribute('aria-selected', String(msg.id === S.openId))

  // Gutter: unread dot, swapped for a checkbox on hover or in selection mode.
  const gutter = el('div', 'row-gutter')
  gutter.appendChild(el('span', 'dot'))
  const check = el('span', `row-check${S.checked.has(msg.id) ? ' on' : ''}`)
  check.appendChild(icon('check', ''))
  check.onclick = (e) => { e.stopPropagation(); toggleCheck(msg.id) }
  gutter.appendChild(check)
  row.appendChild(gutter)

  const body = el('div', 'row-body')

  const line1 = el('div', 'row-line')
  // Sent shows the recipient.
  const who = (S.mailbox === 'sent' || S.mailbox === 'drafts') && !S.query
    ? (msg.to[0] ? msg.to.join(', ') : t('list.noRecipient'))
    : displayName(msg)
  line1.appendChild(el('span', 'row-from', who))
  line1.appendChild(el('span', 'row-time', shortTime(msg.date)))
  body.appendChild(line1)

  body.appendChild(el('div', 'row-subject', msg.subject || t('reader.noSubject')))
  if (msg.snippet) body.appendChild(el('div', 'row-preview', msg.snippet))

  if (msg.hasAttachments || msg.starred) {
    const meta = el('div', 'row-meta')
    if (msg.hasAttachments) {
      const a = el('span', 'attach-mark')
      a.appendChild(icon('paperclip', ''))
      meta.appendChild(a)
    }
    body.appendChild(meta)
  }
  row.appendChild(body)

  const star = el('button', `row-star${msg.starred ? ' on' : ''}`)
  star.setAttribute('aria-label', t(msg.starred ? 'reader.unstarTitle' : 'reader.starTitle'))
  star.appendChild(icon('star', ''))
  star.onclick = (e) => { e.stopPropagation(); toggleStar(msg) }
  row.appendChild(star)

  row.onclick = () => {
    S.cursor = index
    // A draft is unfinished mail: reopen it for editing rather than reading.
    if (msg.draftId) openDraft(msg)
    else openMessage(msg.id)
  }
  return row
}

function paintCounts() {
  const unread = S.counts.unread ?? 0
  document.querySelectorAll('[data-count="unread"]').forEach((b) => {
    b.textContent = unread
    b.classList.toggle('hidden', unread === 0)
  })
  document.title = unread > 0 ? `labMail (${unread})` : 'labMail'
}

// ══ Selection ═══════════════════════════════════════════════════════════
function toggleCheck(id) {
  if (S.checked.has(id)) S.checked.delete(id); else S.checked.add(id)
  const row = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`)
  if (row) {
    row.classList.toggle('checked', S.checked.has(id))
    row.querySelector('.row-check')?.classList.toggle('on', S.checked.has(id))
  }
  syncBulkBar()
}

/**
 * Select every row on the page — the page, not the mailbox. A control that
 * silently selected a thousand unseen messages before a delete would be a trap.
 */
function toggleSelectAll(on) {
  for (const msg of S.messages) {
    if (on) S.checked.add(msg.id); else S.checked.delete(msg.id)
    const row = document.querySelector(`.row[data-id="${CSS.escape(msg.id)}"]`)
    if (row) {
      row.classList.toggle('checked', on)
      row.querySelector('.row-check')?.classList.toggle('on', on)
    }
  }
  syncBulkBar()
}

function syncBulkBar() {
  const n = S.checked.size
  const inTrash = S.mailbox === 'trash'
  // One control, two homes: the filter row and the bulk bar swap places, and
  // the checkbox has to stay reachable in both.
  for (const id of ['select-all', 'select-all-bulk']) {
    const box = $(id)
    if (!box) continue
    box.checked = n > 0 && n === S.messages.length
    // Some but not all: the control should not claim either state.
    box.indeterminate = n > 0 && n < S.messages.length
  }
  // Restoring is the useful bulk action in Spam; archiving is not.
  $('bulk-notspam').classList.toggle('hidden', S.mailbox !== 'spam')
  $('bulk-archive').classList.toggle('hidden', S.mailbox === 'spam' || inTrash)
  // In Trash the choices are to put a message back or to be done with it.
  // Trashing again would only re-apply the label it already carries.
  $('bulk-restore').classList.toggle('hidden', !inTrash)
  $('bulk-trash').classList.toggle('hidden', inTrash)
  $('bulk-remove').classList.toggle('hidden', !inTrash)
  document.body.classList.toggle('selecting', n > 0)
  $('bulkbar').classList.toggle('hidden', n === 0)
  $('filters').classList.toggle('hidden', n > 0)
  $('bulk-count').textContent = t('list.selected', { n })
}

function clearChecks() {
  S.checked.clear()
  document.querySelectorAll('.row.checked').forEach((r) => {
    r.classList.remove('checked')
    r.querySelector('.row-check')?.classList.remove('on')
  })
  syncBulkBar()
}

async function bulkAction(action, successKey) {
  const ids = [...S.checked]
  if (ids.length === 0) return
  const openWasActedOn = S.openId != null && S.checked.has(S.openId)
  clearChecks()
  // Optimistic removal; the list reconciles on reload.
  ids.forEach((id) => document.querySelector(`.row[data-id="${CSS.escape(id)}"]`)?.remove())
  try {
    const res = await api('/api/messages/bulk', {
      method: 'POST', body: JSON.stringify({ ids, action }),
    })
    if (res.applied > 0) toast(t(successKey, { n: res.applied }))
    if (res.failed?.length) toast(t('toast.bulkFailed', { n: res.failed.length }))
  } catch (err) {
    toast(err.message)
  }
  // The reader would otherwise keep showing a message that is now gone.
  if (openWasActedOn && action !== 'unread') showReaderPlaceholder()
  await loadList()
}

async function toggleStar(msg) {
  msg.starred = !msg.starred
  const row = document.querySelector(`.row[data-id="${CSS.escape(msg.id)}"] .row-star`)
  const paint = () => {
    row?.classList.toggle('on', msg.starred)
    // The label describes the action the button performs, so it has to flip too.
    row?.setAttribute('aria-label', t(msg.starred ? 'reader.unstarTitle' : 'reader.starTitle'))
  }
  paint()
  try {
    await api(`/api/messages/${msg.id}/action`, {
      method: 'POST', body: JSON.stringify({ action: msg.starred ? 'star' : 'unstar' }),
    })
  } catch (err) {
    msg.starred = !msg.starred
    paint()
    toast(err.message)
  }
}

// ══ Reader: conversation view ═══════════════════════════════════════════
function showReaderPlaceholder() {
  S.openId = null; S.thread = null
  syncUrl({ replace: true })
  $('reader-actions').innerHTML = ''
  const scroll = $('reader-scroll')
  scroll.innerHTML = ''
  scroll.appendChild(stateBlock('mail', t('state.pickMessageTitle'), t('state.pickMessageBody')))
}

/** Reopen a stored draft in the composer. */
async function openDraft(row) {
  try {
    const { message } = await api(`/api/messages/${row.id}`)
    openCompose({
      title: t('compose.draftTitle'),
      to: message.to.join(', '),
      cc: message.cc.join(', '),
      subject: message.subject,
      html: message.bodyHtml || textToEditorHtml(message.bodyText || ''),
      draftId: row.draftId,
    })
  } catch (err) {
    toast(err.message)
  }
}

async function openMessage(id) {
  S.openId = id
  syncUrl()
  document.querySelectorAll('.row').forEach((r) => {
    const on = r.dataset.id === id
    r.classList.toggle('selected', on)
    r.setAttribute('aria-selected', String(on))
  })
  if (window.matchMedia('(max-width: 820px)').matches) setPane('reader')

  const scroll = $('reader-scroll')
  scroll.innerHTML = ''
  scroll.appendChild(skeletonList(3))

  try {
    const data = await api(`/api/messages/${id}`)
    S.thread = data.thread?.length ? data.thread : [data.message]
    renderThread(id)

    // Painted first so the row responds at once, then persisted: without the
    // call the change would live only in this tab.
    const local = S.messages.find((m) => m.id === id)
    if (local?.unread) {
      const row = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`)
      local.unread = false
      row?.classList.remove('unread')
      S.counts.unread = Math.max(0, (S.counts.unread ?? 1) - 1)
      paintCounts()
      try {
        await api(`/api/messages/${id}/action`, {
          method: 'POST', body: JSON.stringify({ action: 'read' }),
        })
      } catch {
        // Put it back rather than show a state the server does not share.
        local.unread = true
        row?.classList.add('unread')
        S.counts.unread = (S.counts.unread ?? 0) + 1
        paintCounts()
      }
    }
  } catch (err) {
    scroll.innerHTML = ''
    scroll.appendChild(stateBlock('empty', t('state.openFailed'), err.message))
  }
}

function renderThread(focusId) {
  const scroll = $('reader-scroll')
  scroll.innerHTML = ''
  const thread = S.thread
  const latest = thread[thread.length - 1]

  const head = el('div', 'thread-head')
  if (latest.labels.includes('SPAM')) {
    const flag = el('div', 'spam-flag')
    flag.append(icon('spam', 'icon-sm'), el('span', null, t('reader.spamNotice')))
    const undo = el('button', null, t('reader.notSpamTitle'))
    undo.onclick = () => act(latest.id, 'notspam', 'toast.notSpam')
    flag.appendChild(undo)
    head.appendChild(flag)
  }
  head.appendChild(el('h1', 'thread-subject', latest.subject || t('reader.noSubject')))
  if (thread.length > 1) {
    head.appendChild(el('div', 'thread-meta', t('reader.messageCount', { n: thread.length })))
  }
  scroll.appendChild(head)

  thread.forEach((msg, i) => {
    // The opened message, or the newest, starts expanded.
    const expanded = msg.id === focusId || (thread.length === 1) || (i === thread.length - 1 && !thread.some((m) => m.id === focusId))
    scroll.appendChild(renderThreadMessage(msg, expanded))
  })

  const dock = el('div', 'reply-dock')
  const reply = el('button', 'bordered')
  reply.append(icon('reply', 'icon-sm'), document.createTextNode(t('reader.reply')))
  reply.onclick = () => composeReply(latest, 'reply')
  const replyAll = el('button', 'bordered')
  replyAll.append(icon('reply-all', 'icon-sm'), document.createTextNode(t('reader.replyAll')))
  replyAll.onclick = () => composeReply(latest, 'replyAll')
  const forward = el('button', 'bordered')
  forward.append(icon('forward', 'icon-sm'), document.createTextNode(t('reader.forward')))
  forward.onclick = () => composeReply(latest, 'forward')
  dock.append(gateSend(reply), gateSend(replyAll), gateSend(forward))
  if (!canSend()) {
    const why = el('div', 'help')
    why.style.cssText = 'flex-basis:100%;margin-top:2px'
    why.textContent = t('mailbox.sendNotReady')
    dock.appendChild(why)
  }
  scroll.appendChild(dock)

  if (S.categories.length > 0) scroll.insertBefore(categoryStrip(latest), scroll.firstChild.nextSibling)
  renderReaderActions(latest)
  scroll.scrollTop = 0
}

/** Toggle strip: the member's categories, with the ones on this message lit. */
function categoryStrip(msg) {
  const strip = el('div', 'cat-strip')
  const assigned = new Set(msg.categories || [])
  for (const category of S.categories) {
    const chip = el('button', 'cat-chip', category.name)
    const on = assigned.has(category.id)
    chip.classList.toggle('on', on)
    chip.style.setProperty('--chip', categoryColor(category.color))
    chip.onclick = async () => {
      const next = !chip.classList.contains('on')
      chip.classList.toggle('on', next)
      try {
        await api(`/api/messages/${msg.id}/categories`, {
          method: 'POST', body: JSON.stringify({ categoryId: category.id, on: next }),
        })
        if (next) assigned.add(category.id); else assigned.delete(category.id)
        msg.categories = [...assigned]
        void loadCategories()
      } catch (err) {
        chip.classList.toggle('on', !next)
        toast(err.message)
      }
    }
    strip.appendChild(chip)
  }
  return strip
}

function renderThreadMessage(msg, expanded) {
  const wrap = el('div', `msg${expanded ? ' expanded' : ''}`)

  const head = el('div', 'msg-head')
  head.appendChild(avatarFor(msg.fromName, msg.from, expanded ? 'lg' : null))

  const who = el('div', 'msg-who')
  who.appendChild(el('div', 'msg-name', displayName(msg)))
  if (expanded) {
    who.appendChild(el('div', 'msg-addr', msg.from))
    const recipients = [...msg.to, ...msg.cc.map((a) => t('reader.ccSuffix', { addr: a }))]
    if (recipients.length) who.appendChild(el('div', 'msg-to', t('reader.to', { list: recipients.join(', ') })))
  } else {
    who.appendChild(el('div', 'msg-collapsed-preview', msg.snippet || ''))
  }
  head.appendChild(who)
  head.appendChild(el('div', 'msg-time', expanded ? fullTime(msg.date) : shortTime(msg.date)))
  wrap.appendChild(head)

  if (expanded) wrap.appendChild(renderMessageBody(msg))

  head.onclick = () => {
    const nowExpanded = !wrap.classList.contains('expanded')
    wrap.classList.toggle('expanded', nowExpanded)
    wrap.querySelector('.msg-body')?.remove()
    who.innerHTML = ''
    who.appendChild(el('div', 'msg-name', displayName(msg)))
    if (nowExpanded) {
      who.appendChild(el('div', 'msg-addr', msg.from))
      const recipients = [...msg.to, ...msg.cc.map((a) => t('reader.ccSuffix', { addr: a }))]
      if (recipients.length) who.appendChild(el('div', 'msg-to', t('reader.to', { list: recipients.join(', ') })))
      head.querySelector('.msg-time').textContent = fullTime(msg.date)
      wrap.appendChild(renderMessageBody(msg))
    } else {
      who.appendChild(el('div', 'msg-collapsed-preview', msg.snippet || ''))
      head.querySelector('.msg-time').textContent = shortTime(msg.date)
    }
  }
  return wrap
}

// Frames are sized against the reader pane, so they all re-fit together.
window.addEventListener('resize', () => {
  for (const frame of document.querySelectorAll('.msg-frame')) frame.__fit?.()
})

/**
 * Fill a node with text, turning bare URLs and addresses into links: plain-text
 * mail carries no markup. Built from text nodes rather than innerHTML, since
 * the source is untrusted and none of it should be parsed.
 */
const LINKABLE = /((?:https?:\/\/|www\.)[^\s<>"'()\[\]]+|[\w.+-]+@[\w-]+\.[\w.-]+)/g

function linkifyInto(node, text) {
  let last = 0
  for (const match of text.matchAll(LINKABLE)) {
    const raw = match[0]
    // Sentence punctuation is not part of the address.
    const trimmed = raw.replace(/[.,;:!?)\]]+$/, '')
    const start = match.index
    if (start > last) node.appendChild(document.createTextNode(text.slice(last, start)))

    const a = el('a', null, trimmed)
    a.href = trimmed.includes('@') && !/^https?:/i.test(trimmed)
      ? `mailto:${trimmed}`
      : trimmed.startsWith('www.') ? `https://${trimmed}` : trimmed
    a.target = '_blank'
    a.rel = 'noopener noreferrer'
    node.appendChild(a)

    last = start + trimmed.length
  }
  node.appendChild(document.createTextNode(text.slice(last)))
  return node
}

function renderMessageBody(msg) {
  const body = el('div', 'msg-body')

  if (msg.bodyHtml) {
    const frame = el('iframe', 'msg-frame')
    // No scripts, no forms, null origin. Popups are allowed, or the
    // `<base target="_blank">` below has nothing to open and every link in an
    // HTML mail is inert; without allow-scripts only a real click opens one.
    frame.setAttribute('sandbox', 'allow-popups allow-popups-to-escape-sandbox')
    frame.setAttribute('referrerpolicy', 'no-referrer')
    frame.setAttribute('title', msg.subject || t('reader.bodyTitle'))
    const dark = isDark()
    frame.srcdoc = `<!doctype html><meta charset="utf-8"><base target="_blank">
<style>
  :root { color-scheme: ${dark ? 'dark' : 'light'} }
  body { margin:0; font:13.5px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",
         "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         color:${dark ? '#f2f2f5' : '#1c1c1e'}; background:transparent; word-break:break-word }
  img { max-width:100%; height:auto }
  a { color:${dark ? '#4b8bff' : '#2f6fed'} }
  blockquote { border-left:3px solid ${dark ? '#3a3a40' : '#dfdfe4'}; margin:0 0 0 2px;
               padding-left:12px; color:${dark ? '#a8a8ae' : '#6a6a70'} }
  table { max-width:100% }
  pre { white-space:pre-wrap; word-break:break-word }
</style>
${msg.bodyHtml}`
    // A null origin means contentDocument is null, so the content cannot be
    // measured. Sized to the reader's remaining height instead; long mail
    // scrolls inside the frame, which is the trade for an opaque origin.
    const fit = () => {
      const scroll = $('reader-scroll')
      if (!scroll || !frame.isConnected) return
      const paneHeight = scroll.clientHeight
      if (!paneHeight) return
      // How far down the pane this message starts. Capped so a message pushed
      // below the fold still gets most of a screen rather than collapsing.
      const offset = Math.min(
        Math.max(0, frame.getBoundingClientRect().top - scroll.getBoundingClientRect().top),
        paneHeight * 0.35,
      )
      frame.style.height = `${Math.max(Math.round(paneHeight - offset - 24), 360)}px`
    }
    frame.__fit = fit
    frame.onload = fit
    requestAnimationFrame(fit)
    body.appendChild(frame)
  } else {
    const { body: main, quote } = splitQuote(msg.bodyText || '')
    body.appendChild(linkifyInto(el('div', 'msg-text'), main || t('reader.noBody')))
    if (quote) {
      const toggle = el('button', 'quote-toggle', '···')
      toggle.setAttribute('aria-label', t('reader.showQuote'))
      const quoted = el('div', 'msg-text')
      quoted.style.cssText = 'color:var(--text-3);margin-top:10px;display:none'
      linkifyInto(quoted, quote)
      toggle.onclick = () => {
        const show = quoted.style.display === 'none'
        quoted.style.display = show ? 'block' : 'none'
        toggle.setAttribute('aria-expanded', String(show))
      }
      body.append(toggle, quoted)
    }
  }

  if (msg.attachments?.length) {
    const strip = el('div', 'attach-strip')
    for (const att of msg.attachments) {
      const link = el('a', 'attach')
      link.href = `/api/messages/${msg.id}/attachments/${att.id}`
      link.download = att.filename
      link.appendChild(icon('paperclip', 'icon-sm'))
      link.appendChild(el('span', 'attach-name', att.filename))
      link.appendChild(el('span', 'attach-size', formatSize(att.size)))
      strip.appendChild(link)
    }
    body.appendChild(strip)
  }
  return body
}

function renderReaderActions(msg) {
  const bar = $('reader-actions')
  bar.innerHTML = ''
  const inTrash = msg.labels.includes('TRASH')
  const inSpam = msg.labels.includes('SPAM')

  const add = (name, title, onClick) => {
    const b = el('button', null)
    b.title = title
    b.setAttribute('aria-label', title)
    b.appendChild(icon(name))
    b.onclick = onClick
    bar.appendChild(b)
    return b
  }

  if (inSpam) {
    // Recovering a misclassified message is the only thing worth doing here,
    // so it gets a labelled button rather than another icon in a row.
    const restore = el('button', 'bordered')
    restore.append(icon('not-spam', 'icon-sm'), document.createTextNode(t('reader.notSpamTitle')))
    restore.onclick = () => act(msg.id, 'notspam', 'toast.notSpam')
    bar.appendChild(restore)
    add('trash', t('reader.deleteTitle'), () => act(msg.id, 'trash', 'toast.trashed'))
    bar.appendChild(el('span', 'bar-sep'))
  } else {
    if (!inTrash) add('archive', t('reader.archiveTitle'), () => act(msg.id, 'archive', 'toast.archived'))
    if (inTrash) {
      add('restore', t('reader.restoreTitle'), () => act(msg.id, 'untrash', 'toast.restored'))
      add('trash', t('reader.removeTitle'), async () => {
        if (await askConfirm(t('reader.removeConfirm'), { danger: true })) act(msg.id, 'remove', 'toast.removed')
      })
    }
    else add('trash', t('reader.deleteTitle'), () => act(msg.id, 'trash', 'toast.trashed'))
    add('spam', t('reader.spamTitle'), () => act(msg.id, 'spam', 'toast.reportedSpam'))
    bar.appendChild(el('span', 'bar-sep'))
  }
  add('mail', t('reader.unreadTitle'), () => act(msg.id, 'unread', 'toast.markedUnread'))
  const star = add('star', t('reader.starTitle'), () => {
    const local = S.messages.find((m) => m.id === msg.id) || msg
    toggleStar(local)
    star.querySelector('svg').style.fill = local.starred ? '#e8a33d' : 'none'
    star.querySelector('svg').style.stroke = local.starred ? '#e8a33d' : 'currentColor'
  })
  if (msg.starred) {
    star.querySelector('svg').style.fill = '#e8a33d'
    star.querySelector('svg').style.stroke = '#e8a33d'
  }
}

/** Apply an action to the open message, then advance like a real client does. */
async function act(id, action, successKey) {
  const index = S.messages.findIndex((m) => m.id === id)
  try {
    await api(`/api/messages/${id}/action`, { method: 'POST', body: JSON.stringify({ action }) })
  } catch (err) { toast(err.message); return }

  if (action === 'unread') {
    const local = S.messages[index]
    if (local) { local.unread = true
      document.querySelector(`.row[data-id="${CSS.escape(id)}"]`)?.classList.add('unread') }
    toast(t(successKey))
    return
  }

  if (index >= 0) S.messages.splice(index, 1)
  document.querySelector(`.row[data-id="${CSS.escape(id)}"]`)?.remove()
  toast(t(successKey))

  if (id === S.openId && index < 0) { showReaderPlaceholder(); return }

  // Advance to the neighbour rather than returning to an empty pane.
  const next = S.messages[index] || S.messages[index - 1]
  if (next) { S.cursor = S.messages.indexOf(next); openMessage(next.id) }
  else { showReaderPlaceholder(); renderList() }
}

// ══ Recipient autocomplete ══════════════════════════════════════════════════
let suggestState = { field: null, items: [], index: -1, timer: null, cache: new Map() }

/** The address being typed: the comma-separated token around the caret. */
function tokenAt(input) {
  const value = input.value
  const caret = input.selectionStart ?? value.length
  const start = Math.max(value.lastIndexOf(',', caret - 1), value.lastIndexOf(';', caret - 1)) + 1
  let end = value.length
  for (const sep of [',', ';']) {
    const at = value.indexOf(sep, caret)
    if (at >= 0) end = Math.min(end, at)
  }
  return { start, end, text: value.slice(start, end).trim() }
}

function hideSuggestions() {
  $('suggest').classList.add('hidden')
  suggestState.field = null
  suggestState.items = []
  suggestState.index = -1
}

function renderSuggestions(input, items) {
  const host = $('suggest')
  host.innerHTML = ''
  if (items.length === 0) { hideSuggestions(); return }

  items.forEach((c, i) => {
    const row = el('div', `suggest-item${i === suggestState.index ? ' on' : ''}`)
    row.setAttribute('role', 'option')
    row.appendChild(avatarFor(c.name, c.email))
    const text = el('div', 'suggest-text')
    text.append(el('div', 'suggest-name', c.name || c.email.split('@')[0]),
                el('div', 'suggest-mail', c.email))
    row.appendChild(text)
    // mousedown, not click: blur would close the list before click fires.
    row.addEventListener('mousedown', (e) => { e.preventDefault(); applySuggestion(input, c) })
    host.appendChild(row)
  })

  const box = input.getBoundingClientRect()
  host.style.left = `${box.left}px`
  host.style.top = `${box.bottom + 4}px`
  host.style.width = `${Math.max(box.width, 260)}px`
  host.classList.remove('hidden')
  suggestState.field = input
  suggestState.items = items
}

function applySuggestion(input, contact) {
  const { start, end } = tokenAt(input)
  const before = input.value.slice(0, start)
  const after = input.value.slice(end)
  input.value = `${before}${contact.email}, ${after.replace(/^[,;\s]*/, '')}`
  const caret = (before + contact.email + ', ').length
  input.setSelectionRange(caret, caret)
  hideSuggestions()
  markAddressValidity(input)
  scheduleDraftSave()
}

async function requestSuggestions(input) {
  const { text } = tokenAt(input)
  if (text.length < 1) { hideSuggestions(); return }

  const key = text.toLowerCase()
  let items = suggestState.cache.get(key)
  if (!items) {
    try {
      const data = await api(`/api/contacts?q=${encodeURIComponent(text)}`)
      items = data.contacts
      suggestState.cache.set(key, items)
    } catch { return }
  }
  // The caret may have moved on while the request was in flight.
  if (document.activeElement !== input) return
  suggestState.index = -1
  renderSuggestions(input, items)
}

/** Flag addresses the server would reject, once the field is complete. */
function markAddressValidity(input) {
  const bad = splitAddrs(input.value).filter((a) => !looksLikeAddress(a))
  input.classList.toggle('invalid', bad.length > 0)
  return bad
}

// Mirrors the server's rule so the composer and the API agree.
const looksLikeAddress = (value) =>
  /^[^\s<>@\x00-\x1f\x7f]+@[^\s<>@\x00-\x1f\x7f]+\.[^\s<>@\x00-\x1f\x7f]+$/.test(value.trim())

function wireRecipientField(id) {
  const input = $(id)
  input.addEventListener('input', () => {
    // Judged on blur, not per keystroke: a half-typed address is not yet wrong,
    // and turning the field red on the first character is just noise.
    input.classList.remove('invalid')
    clearTimeout(suggestState.timer)
    suggestState.timer = setTimeout(() => { void requestSuggestions(input) }, 140)
  })
  input.addEventListener('blur', () => {
    markAddressValidity(input)
    setTimeout(hideSuggestions, 120)
  })
  input.addEventListener('keydown', (e) => {
    const open = !$('suggest').classList.contains('hidden') && suggestState.field === input
    if (!open) return
    const total = suggestState.items.length
    if (e.key === 'ArrowDown') {
      e.preventDefault()
      suggestState.index = (suggestState.index + 1) % total
      renderSuggestions(input, suggestState.items)
    } else if (e.key === 'ArrowUp') {
      e.preventDefault()
      suggestState.index = (suggestState.index - 1 + total) % total
      renderSuggestions(input, suggestState.items)
    } else if ((e.key === 'Enter' || e.key === 'Tab') && suggestState.index >= 0) {
      e.preventDefault()
      applySuggestion(input, suggestState.items[suggestState.index])
    } else if (e.key === 'Escape') {
      e.preventDefault()
      // Stop the document handler seeing it: Escape closes the composer, and
      // dismissing the suggestion list should not throw away the message.
      e.stopPropagation()
      hideSuggestions()
    }
  })
}

// ══ Rich text editor ════════════════════════════════════════════════════════
// Style is emitted as CSS, not <font> or align=: those are outside the
// sanitizer's allowlist and would vanish when the message was sent.
try { document.execCommand('styleWithCSS', false, true) } catch { /* older engines */ }

// contenteditable and document.execCommand: deprecated but universally
// implemented, and this project has no build step to pull an editor into.

const EDITOR_TAGS = new Set([
  'P', 'BR', 'DIV', 'SPAN', 'B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'DEL',
  'A', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'PRE', 'CODE', 'H1', 'H2', 'H3', 'HR',
])
const EDITOR_ATTRS = { A: new Set(['href', 'title']) }
// Removed with their contents, matching the server. Unwrapping these instead
// would leave script or style source sitting in the message as visible text.
const EDITOR_DROP = new Set(['SCRIPT', 'STYLE', 'HEAD', 'TITLE', 'IFRAME', 'OBJECT', 'EMBED', 'NOSCRIPT'])
const SAFE_URL = /^(https?:|mailto:)/i

/**
 * Strip a pasted fragment down to what the composer supports.
 *
 * The server sanitizes again before sending; this keeps the editing surface
 * clean so the author sees what will actually go out.
 */
function cleanFragment(root) {
  for (const node of [...root.querySelectorAll('*')]) {
    // Not isConnected: the host is detached from the document, so that reports
    // false for everything. Containment is what says the node still stands.
    if (!root.contains(node)) continue
    if (EDITOR_DROP.has(node.tagName)) { node.remove(); continue }
    if (!EDITOR_TAGS.has(node.tagName)) {
      node.replaceWith(...node.childNodes)
      continue
    }
    const allowed = EDITOR_ATTRS[node.tagName]
    for (const attr of [...node.attributes]) {
      if (!allowed?.has(attr.name.toLowerCase())) { node.removeAttribute(attr.name); continue }
      if (attr.name.toLowerCase() === 'href' && !SAFE_URL.test(attr.value.trim())) {
        node.removeAttribute(attr.name)
      }
    }
  }
  return root.innerHTML
}

function editorHtml() {
  const host = document.createElement('div')
  host.innerHTML = $('c-body').innerHTML
  return cleanFragment(host)
}

/** Plain-text alternative, mirroring the server's own derivation. */
function editorText() {
  const host = document.createElement('div')
  host.innerHTML = $('c-body').innerHTML
  host.querySelectorAll('li').forEach((li) => li.prepend(document.createTextNode('• ')))
  host.querySelectorAll('br').forEach((br) => br.replaceWith('\n'))
  host.querySelectorAll('p, div, blockquote, li, h1, h2, h3, tr')
    .forEach((el) => el.append(document.createTextNode('\n')))
  return (host.textContent || '').replace(/\n{3,}/g, '\n\n').trim()
}

const editorIsEmpty = () => editorText().length === 0

function setEditorHtml(html) {
  const host = document.createElement('div')
  host.innerHTML = html || ''
  $('c-body').innerHTML = cleanFragment(host)
}

/** Escape plain text into the editor, preserving line breaks. */
function textToEditorHtml(text) {
  const escaped = String(text ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  return escaped.split('\n').map((line) => `<div>${line || '<br>'}</div>`).join('')
}

function runCommand(cmd, arg) {
  $('c-body').focus()
  document.execCommand(cmd, false, arg)
  refreshToolbar()
  scheduleDraftSave()
}

/** Reflect the caret's formatting in the toolbar. */
function refreshToolbar() {
  document.querySelectorAll('#c-toolbar button[data-cmd]').forEach((b) => {
    const cmd = b.dataset.cmd
    if (cmd === 'removeFormat' || cmd === 'formatBlock') return
    let on = false
    try { on = document.queryCommandState(cmd) } catch { on = false }
    b.classList.toggle('on', on)
  })
}

function insertLink() {
  const body = $('c-body')
  body.focus()
  const selection = window.getSelection()
  const selected = selection?.toString() ?? ''
  const url = prompt(t('compose.linkPrompt'), 'https://')
  if (!url) return
  const clean = url.trim()
  if (!SAFE_URL.test(clean)) { toast(t('mailbox.invalidLink')); return }
  if (selected) document.execCommand('createLink', false, clean)
  else document.execCommand('insertHTML', false,
    `<a href="${clean.replace(/"/g, '&quot;')}">${clean.replace(/</g, '&lt;')}</a>`)
  scheduleDraftSave()
}

function wireEditor() {
  const body = $('c-body')

  document.querySelectorAll('#c-toolbar button[data-cmd]').forEach((b) => {
    // mousedown, not click: the default would move focus out of the editor and
    // collapse the selection before the command runs.
    b.addEventListener('mousedown', (e) => {
      e.preventDefault()
      runCommand(b.dataset.cmd, b.dataset.arg)
    })
  })
  $('c-link').addEventListener('mousedown', (e) => { e.preventDefault(); insertLink() })

  body.addEventListener('paste', (e) => {
    e.preventDefault()
    const html = e.clipboardData?.getData('text/html')
    const text = e.clipboardData?.getData('text/plain') ?? ''
    if (html) {
      const host = document.createElement('div')
      host.innerHTML = html
      document.execCommand('insertHTML', false, cleanFragment(host))
    } else {
      document.execCommand('insertText', false, text)
    }
    scheduleDraftSave()
  })

  body.addEventListener('input', () => { refreshToolbar(); scheduleDraftSave() })
  body.addEventListener('keyup', refreshToolbar)
  body.addEventListener('mouseup', refreshToolbar)

  body.addEventListener('keydown', (e) => {
    if (!(e.metaKey || e.ctrlKey)) return
    const key = e.key.toLowerCase()
    const command = { b: 'bold', i: 'italic', u: 'underline' }[key]
    if (command) { e.preventDefault(); runCommand(command) }
    else if (key === 'k') { e.preventDefault(); insertLink() }
  })
}

// ══ Compose ═════════════════════════════════════════════════════════════
const DRAFT_KEY = 'labmail:draft'
let composeState = { replyTo: null, files: [], open: false, draftId: null, saving: false }
let draftTimer = null

const splitAddrs = (v) => v.split(/[,;]/).map((s) => s.trim()).filter(Boolean)

function openCompose(opts = {}) {
  composeState = {
    replyTo: opts.replyTo ?? null, files: [], open: true,
    draftId: opts.draftId ?? null, saving: false,
  }
  $('c-title').textContent = opts.title || t('compose.title')
  $('c-to').value = opts.to || ''
  $('c-cc').value = opts.cc || ''
  $('c-bcc').value = ''
  $('c-subject').value = opts.subject || ''
  const signature = S.me?.signature
    ? `<div><br></div><div class="sig">${S.me.signature}</div>`
    : ''
  const composed = opts.html ?? textToEditorHtml(opts.body || '')
  // Signature above the quote: the reply reads as yours, then the original.
  setEditorHtml(opts.draftId || opts.skipSignature
    ? composed
    : signature + composed)
  $('c-body').setAttribute('data-placeholder', t('compose.bodyPlaceholder'))
  refreshToolbar()
  $('c-cc-row').classList.toggle('hidden', !opts.cc)
  $('c-bcc-row').classList.add('hidden')
  $('c-drop').classList.add('hidden')
  hideSuggestions()
  suggestState.cache.clear()
  for (const id of ['c-to', 'c-cc', 'c-bcc']) $(id).classList.remove('invalid')
  $('c-from').innerHTML = ''
  $('c-from').append(document.createTextNode(`${S.me.displayName} `))
  const strong = el('strong', null, `<${S.me.alias}>`)
  $('c-from').appendChild(strong)
  notice($('c-notice'), '')
  $('c-status').textContent = ''
  $('c-draft-note').textContent = ''
  renderFiles()
  $('compose').classList.remove('hidden')
  setTimeout(() => {
    if (!opts.to) { $('c-to').focus(); return }
    const body = $('c-body')
    body.focus()
    // quoteOf() opens with an empty line for exactly this: the caret is placed
    // there explicitly, so a reply is not typed under the quoted history.
    const first = body.firstChild
    if (first) {
      const range = document.createRange()
      range.setStart(first, 0)
      range.collapse(true)
      const sel = getSelection()
      sel.removeAllRanges()
      sel.addRange(range)
    }
  }, 30)
}

function closeCompose({ keepDraft = true } = {}) {
  if (keepDraft && hasComposeContent()) void saveDraft()
  composeState.open = false
  clearTimeout(draftTimer)
  $('compose').classList.add('hidden')
}

const hasComposeContent = () =>
  Boolean($('c-to').value.trim() || $('c-subject').value.trim() || !editorIsEmpty())

/** Local fallback, per browser. Attachments excluded. */
function saveLocalDraft() {
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      to: $('c-to').value, cc: $('c-cc').value, bcc: $('c-bcc').value,
      subject: $('c-subject').value, html: $('c-body').innerHTML,
      replyTo: composeState.replyTo, savedAt: Date.now(),
    }))
  } catch { /* private mode, quota — a draft is a convenience, not a promise */ }
}

/**
 * Persist the draft to Gmail so it survives the browser and appears in Drafts.
 *
 * Falls back to browser storage alone when Google is not connected, which is
 * also the state before an administrator finishes setup.
 */
async function saveDraft() {
  saveLocalDraft()
  if (!S.connected) {
    // Browser storage is the only store before Google is connected; say so
    // rather than leaving the composer looking as though nothing was kept.
    $('c-draft-note').textContent = t('compose.draftSavedLocally')
    return
  }
  if (composeState.saving) return

  composeState.saving = true
  $('c-draft-note').textContent = t('compose.draftSaving')
  try {
    const result = await api('/api/drafts', {
      method: 'POST',
      body: JSON.stringify({
        draftId: composeState.draftId,
        to: splitAddrs($('c-to').value),
        cc: splitAddrs($('c-cc').value),
        bcc: splitAddrs($('c-bcc').value),
        subject: $('c-subject').value,
        bodyText: editorText(),
        bodyHtml: editorHtml(),
        replyToMessageId: composeState.replyTo,
      }),
    })
    composeState.draftId = result.draftId
    $('c-draft-note').textContent = t('compose.draftSavedAt', {
      time: new Date().toLocaleTimeString(localeTag(), { hour: 'numeric', minute: '2-digit' }),
    })
    if (S.mailbox === 'drafts') loadList()
  } catch {
    // A rejected address or a transient failure must not cost the text, which
    // browser storage already holds.
    $('c-draft-note').textContent = t('compose.draftSyncFailed')
  } finally {
    composeState.saving = false
  }
}

function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY)
    return raw ? JSON.parse(raw) : null
  } catch { return null }
}

function dropDraft() {
  try { localStorage.removeItem(DRAFT_KEY) } catch { /* ignore */ }
  $('c-draft-note').textContent = ''
}

function scheduleDraftSave() {
  clearTimeout(draftTimer)
  if (!hasComposeContent()) return
  // Longer than a keystroke pause: each save is a Gmail API call, and all
  // members share one account's quota.
  draftTimer = setTimeout(() => { void saveDraft() }, 2000)
}

function renderFiles() {
  const host = $('c-files')
  host.innerHTML = ''
  host.classList.toggle('hidden', composeState.files.length === 0)
  let total = 0
  composeState.files.forEach((file, i) => {
    total += file.size
    const chip = el('span', 'file-chip')
    chip.append(el('span', null, file.name), el('span', 'attach-size', formatSize(file.size)))
    const x = el('button', null)
    x.setAttribute('aria-label', t('compose.removeFile', { name: file.name }))
    x.appendChild(icon('close', 'icon-sm'))
    x.onclick = () => { composeState.files.splice(i, 1); renderFiles() }
    chip.appendChild(x)
    host.appendChild(chip)
  })
  // The 25MB message limit, surfaced before the send fails.
  const over = composeState.files.some((f) => f.size > GMAIL_ATTACHMENT_LIMIT)
  $('c-status').textContent = over ? t('compose.oversizeDrive') : ''
  $('c-status').style.color = over ? 'var(--warn)' : ''
}

/** The original, as a blockquote the recipient's client will render properly. */
function quoteOf(msg) {
  const when = fullTime(msg.date)
  const who = msg.fromName ? `${msg.fromName} <${msg.from}>` : msg.from
  const escape = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

  let quoted
  if (msg.bodyHtml) {
    const host = document.createElement('div')
    host.innerHTML = msg.bodyHtml
    quoted = cleanFragment(host)
  } else {
    quoted = textToEditorHtml(msg.bodyText || msg.snippet || '')
  }
  return `<div><br></div><div>${escape(t('compose.quoteHeader', { when, who }))}</div>`
    + `<blockquote>${quoted}</blockquote>`
}

const withPrefix = (subject, prefix) =>
  subject.toLowerCase().startsWith(prefix.toLowerCase()) ? subject : `${prefix} ${subject}`

function composeReply(msg, mode) {
  if (!msg) return
  if (mode === 'forward') {
    openCompose({ title: t('reader.forward'), subject: withPrefix(msg.subject, 'Fwd:'), html: quoteOf(msg) })
    return
  }
  const others = mode === 'replyAll'
    ? [...msg.to, ...msg.cc].filter((a) => a.toLowerCase() !== S.me.alias.toLowerCase()
                                        && a.toLowerCase() !== msg.from.toLowerCase())
    : []
  openCompose({
    title: t(mode === 'replyAll' ? 'reader.replyAll' : 'reader.reply'),
    to: msg.from,
    cc: others.join(', '),
    subject: withPrefix(msg.subject, 'Re:'),
    html: quoteOf(msg),
    replyTo: msg.id,
  })
}

const readAsBase64 = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader()
  reader.onload = () => resolve(String(reader.result).split(',')[1])
  reader.onerror = reject
  reader.readAsDataURL(file)
})

/** Gmail rejects a message whose attachments exceed this. */
const GMAIL_ATTACHMENT_LIMIT = 25 * 1024 * 1024

/** Words that usually mean a file was meant to be attached. */
const ATTACHMENT_WORDS = /첨부|붙임|attach(ed|ment)?|enclosed/i

async function sendCompose() {
  const to = splitAddrs($('c-to').value)
  if (to.length === 0) { notice($('c-notice'), t('compose.needRecipient')); $('c-to').focus(); return }

  // Catch what the server would reject, while the composer is still open and
  // the author can see which address is wrong.
  const invalid = ['c-to', 'c-cc', 'c-bcc'].flatMap((id) => markAddressValidity($(id)))
  if (invalid.length) {
    notice($('c-notice'), t('compose.invalidAddresses', { list: invalid.join(', ') }))
    return
  }
  if (!$('c-subject').value.trim() && !await askConfirm(t('compose.noSubjectConfirm'))) {
    $('c-subject').focus()
    return
  }
  if (composeState.files.length === 0 && ATTACHMENT_WORDS.test(editorText())
      && !await askConfirm(t('compose.attachmentHint'))) {
    return
  }

  // Anything Gmail would reject goes to Drive and is linked instead, which is
  // the same move Gmail itself makes.
  const oversized = composeState.files.filter((f) => f.size > GMAIL_ATTACHMENT_LIMIT)
  if (oversized.length) {
    $('c-status').textContent = t('compose.sending')
    for (const file of oversized) {
      try {
        const stored = await uploadToDrive(file, null)
        const shared = await api(`/api/drive/${stored.id}/link`, { method: 'POST' })
        $('c-body').focus()
        // A leading break: without it the link is inserted flush against
        // whatever the caret was sitting after, e.g. "See below.file.bin".
        document.execCommand('insertHTML', false,
          `<div><br></div><div><a href="${shared.link}">${stored.name}</a> `
          + `(${formatSize(stored.size)})</div>`)
        composeState.files = composeState.files.filter((f) => f !== file)
      } catch (err) {
        notice($('c-notice'), err.message)
        $('c-status').textContent = ''
        return
      }
    }
    renderFiles()
    toast(t('drive.tooBigForMail'))
  }

  $('c-send').disabled = true
  $('c-status').textContent = t('compose.sending')
  let sent = null
  try {
    const attachments = await Promise.all(composeState.files.map(async (f) => ({
      filename: f.name,
      mimeType: f.type || 'application/octet-stream',
      contentBase64: await readAsBase64(f),
    })))
    if (composeState.draftId && attachments.length === 0) {
      // Update then send, so Gmail consumes the draft instead of leaving it
      // alongside the sent copy.
      await api('/api/drafts', {
        method: 'POST',
        body: JSON.stringify({
          draftId: composeState.draftId,
          to, cc: splitAddrs($('c-cc').value), bcc: splitAddrs($('c-bcc').value),
          subject: $('c-subject').value,
          bodyText: editorText(), bodyHtml: editorHtml(),
          replyToMessageId: composeState.replyTo,
        }),
      })
      await api(`/api/drafts/${composeState.draftId}/send`, { method: 'POST' })
    } else {
      // Attachments are not carried through the draft API, so send directly and
      // discard any draft that was accumulating.
      sent = await api('/api/send', {
        method: 'POST',
        body: JSON.stringify({
          to, cc: splitAddrs($('c-cc').value), bcc: splitAddrs($('c-bcc').value),
          subject: $('c-subject').value,
          bodyText: editorText(), bodyHtml: editorHtml(),
          replyToMessageId: composeState.replyTo, attachments,
        }),
      })
      if (composeState.draftId) {
        await api(`/api/drafts/${composeState.draftId}/discard`, { method: 'POST' }).catch(() => {})
      }
    }
    dropDraft()
    const restore = {
      to: $('c-to').value, cc: $('c-cc').value, bcc: $('c-bcc').value,
      subject: $('c-subject').value, html: $('c-body').innerHTML,
      replyTo: composeState.replyTo,
    }
    closeCompose({ keepDraft: false })

    if (sent?.pendingId && sent.undoSeconds > 0) {
      countdownToast(sent.undoSeconds, async () => {
        try {
          await api(`/api/send/${sent.pendingId}/cancel`, { method: 'POST' })
          toast(t('toast.undone'))
          // Reopened with the original text, signature included, so nothing is
          // retyped after a recall.
          openCompose({ ...restore, skipSignature: true })
          $('c-bcc').value = restore.bcc || ''
          if (restore.cc) $('c-cc-row').classList.remove('hidden')
        } catch (err) { toast(err.message) }
      })
    } else {
      toast(t('toast.sent'))
    }
    if (S.mailbox === 'sent' || S.mailbox === 'drafts') loadList()
  } catch (err) {
    notice($('c-notice'), err.message)
  } finally {
    $('c-send').disabled = false
    $('c-status').textContent = ''
    renderFiles()
  }
}

// ══ Keyboard ════════════════════════════════════════════════════════════
const isTyping = () => {
  const t = document.activeElement
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)
}

function moveCursor(delta) {
  if (S.messages.length === 0) return
  S.cursor = Math.max(0, Math.min(S.messages.length - 1, S.cursor + delta))
  const msg = S.messages[S.cursor]
  const row = document.querySelector(`.row[data-id="${CSS.escape(msg.id)}"]`)
  row?.scrollIntoView({ block: 'nearest' })
  // Preview on move.
  openMessage(msg.id)
}

let chordG = false

document.addEventListener('keydown', (e) => {
  // Modals capture the keyboard.
  if (!$('shortcuts').classList.contains('hidden')) {
    if (e.key === 'Escape') { e.preventDefault(); $('shortcuts').classList.add('hidden') }
    return
  }
  if (composeState.open) {
    if (e.key === 'Escape') { e.preventDefault(); closeCompose() }
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); sendCompose() }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
      e.preventDefault()
      void saveDraft()
    }
    return
  }
  if ($('app').classList.contains('hidden')) return

  if (isTyping()) {
    if (e.key === 'Escape') { e.target.blur(); if (e.target.id === 'search') clearSearch() }
    return
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return

  const current = S.messages[S.cursor] || S.messages.find((m) => m.id === S.openId)

  if (chordG) {
    chordG = false
    const jump = { i: 'inbox', s: 'sent', a: 'archive', t: 'trash' }[e.key.toLowerCase()]
    if (jump) { e.preventDefault(); selectMailbox(jump); return }
  }

  switch (e.key) {
    case 'j': case 'ArrowDown': e.preventDefault(); moveCursor(1); break
    case 'k': case 'ArrowUp':   e.preventDefault(); moveCursor(-1); break
    case 'Enter':
      if (current) { e.preventDefault(); openMessage(current.id); setPane('reader') }
      break
    case 'u': e.preventDefault(); setPane('list'); break
    case 'g': chordG = true; break
    case 'c': e.preventDefault(); openCompose(); break
    case 'r': if (current && canSend()) { e.preventDefault(); composeReply(S.thread?.at(-1) || current, 'reply') } break
    case 'a': if (current && canSend()) { e.preventDefault(); composeReply(S.thread?.at(-1) || current, 'replyAll') } break
    case 'f': if (current && canSend()) { e.preventDefault(); composeReply(S.thread?.at(-1) || current, 'forward') } break
    case 'e': if (current) { e.preventDefault(); act(current.id, 'archive', 'toast.archived') } break
    case '#': case 'Delete': case 'Backspace':
      if (!current) break
      e.preventDefault()
      if (S.mailbox === 'trash') {
        void askConfirm(t('reader.removeConfirm'), { danger: true })
          .then((ok) => { if (ok) act(current.id, 'remove', 'toast.removed') })
      } else act(current.id, 'trash', 'toast.trashed')
      break
    case 's': if (current) { e.preventDefault(); toggleStar(current) } break
    case 'x': if (current) { e.preventDefault(); toggleCheck(current.id) } break
    case '/': e.preventDefault(); $('search').focus(); break
    case '?': e.preventDefault(); $('shortcuts').classList.remove('hidden'); break
    case 'R': e.preventDefault(); runSync(); break
    case 'Escape':
      if (S.checked.size) clearChecks()
      else if (S.query) clearSearch()
      break
  }
})

// ══ Account menu ════════════════════════════════════════════════════════════
function closeAccountMenu() {
  $('account-menu').classList.add('hidden')
  $('btn-account').setAttribute('aria-expanded', 'false')
}

function openAccountMenu() {
  const menu = $('account-menu')
  $('menu-name').textContent = S.me.displayName
  $('menu-mail').textContent = S.me.alias || '—'
  const slot = $('menu-avatar')
  slot.replaceWith(Object.assign(avatarFor(S.me.displayName, S.me.alias || S.me.username, 'lg'),
    { id: 'menu-avatar' }))
  const anchor = $('btn-account').getBoundingClientRect()
  menu.classList.remove('hidden')
  // Measured after it is shown, so it can be placed above the trigger.
  const height = menu.getBoundingClientRect().height
  menu.style.left = `${anchor.left}px`
  menu.style.top = `${Math.max(8, anchor.top - height - 6)}px`
