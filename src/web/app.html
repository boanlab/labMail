function toggleAccountMenu() {
  if ($('account-menu').classList.contains('hidden')) openAccountMenu()
  else closeAccountMenu()
}

// ══ Navigation ══════════════════════════════════════════════════════════
function setPane(pane) {
  document.body.classList.remove('view-list', 'view-reader', 'view-admin')
  document.body.classList.add(`view-${pane}`)
  document.body.classList.remove('nav-open')
}

function markNav(predicate) {
  document.querySelectorAll('.nav-item').forEach((b) => b.classList.toggle('active', predicate(b)))
}

// ══ URL routing ═════════════════════════════════════════════════════════
/**
 * The address bar mirrors the view, so a reload lands where you were. State is
 * the source of truth; the URL is read only on load and on back/forward.
 * `replace` where the view did not really change.
 */
const MAILBOX_PATHS = ['inbox', 'sent', 'archive', 'trash', 'spam', 'drafts']
const VIEW_PATHS = {
  settings: 'settings', members: 'members', profile: 'profile', drive: 'files', audit: 'audit',
  unassigned: 'unassigned',
}
const PATH_VIEWS = Object.fromEntries(Object.entries(VIEW_PATHS).map(([v, p]) => [p, v]))

let applyingPath = false          // guards against writing the URL while reading it

function currentPath() {
  if (S.view !== 'mail') {
    // The open tab is part of the address of an admin screen; rebuilding the
    // path without it would drop the reader back to the first tab on reload.
    const tab = new URLSearchParams(location.search).get('tab')
    return `/${VIEW_PATHS[S.view] ?? 'settings'}${tab ? `?tab=${encodeURIComponent(tab)}` : ''}`
  }
  let path = S.mailbox === 'category' ? `/category/${S.categoryId}` : `/${S.mailbox}`
  if (S.openId) path += `/${encodeURIComponent(S.openId)}`
  const params = new URLSearchParams()
  if (S.query) params.set('q', S.query)
  if (S.filter && S.filter !== 'all') params.set('filter', S.filter)
  const qs = params.toString()
  return qs ? `${path}?${qs}` : path
}

function syncUrl({ replace = false } = {}) {
  if (applyingPath) return
  const next = currentPath()
  if (next === location.pathname + location.search) return
  history[replace ? 'replaceState' : 'pushState']({}, '', next)
}

/** Read the address bar into the view. Returns false if the path is not ours. */
async function applyPath({ initial = false } = {}) {
  const segments = location.pathname.split('/').filter(Boolean)
  const params = new URLSearchParams(location.search)
  applyingPath = true
  try {
    const head = segments[0]
    const view = head ? PATH_VIEWS[head] : null
    // A typed URL can reach a view the sidebar hides. The API refuses either
    // way, but landing on an error page is worse than landing on the mailbox.
    const adminOnly = ['members', 'settings', 'audit', 'unassigned'].includes(view)
    if (view && !(adminOnly && !S.me.isAdmin)) {
      openView(view)
      return true
    }
    if (head === 'category' && segments[1]) {
      await loadCategories()
      openCategory(Number(segments[1]))
      return true
    }
    const mailbox = head && MAILBOX_PATHS.includes(head) ? head : 'inbox'
    // An operator with no mailbox has nothing to show here.
    if (!S.me.alias) { openView(S.me.isAdmin ? 'settings' : 'profile'); return true }

    const query = params.get('q') || ''
    const filter = params.get('filter') || 'all'
    selectMailbox(mailbox, { query, filter })

    const id = segments[1] ? decodeURIComponent(segments[1]) : null
    if (id) await openMessage(id)
    return true
  } finally {
    applyingPath = false
    if (initial) syncUrl({ replace: true })
  }
}

window.addEventListener('popstate', () => { void applyPath() })

// ══ Categories ══════════════════════════════════════════════════════════
/**
 * The member's own categories, in the sidebar and on messages.
 *
 * They are labMail's, not Gmail's: one mailbox serves everyone, so a Gmail
 * label would be shared. These are scoped to the signed-in alias throughout.
 */
async function loadCategories() {
  try {
    const data = await api('/api/categories')
    S.categories = data.categories || []
  } catch { S.categories = [] }
  paintCategories()
}

const CATEGORY_HUES = {
  slate: 215, red: 2, amber: 38, green: 145, teal: 175, blue: 212, violet: 262, pink: 330,
}
const categoryColor = (name) => `hsl(${CATEGORY_HUES[name] ?? 215} 65% 52%)`

function paintCategories() {
  const host = $('category-list')
  host.innerHTML = ''
  $('nav-categories').classList.toggle('hidden', S.categories.length === 0)

  for (const category of S.categories) {
    const btn = el('button', 'nav-item')
    btn.dataset.category = String(category.id)
    const dot = el('span', 'cat-dot')
    dot.style.background = categoryColor(category.color)
    const label = el('span', 'nav-label', category.name)
    btn.append(dot, label)
    if (category.count > 0) btn.appendChild(el('span', 'badge', String(category.count)))
    btn.onclick = () => openCategory(category.id)
    if (S.view === 'mail' && S.mailbox === 'category' && S.categoryId === category.id) {
      btn.classList.add('active')
    }
    host.appendChild(btn)
  }
}

function openCategory(categoryId) {
  S.categoryId = categoryId
  selectMailbox('category')
}

function selectMailbox(mailbox, { query = '', filter = 'all' } = {}) {
  if (mailbox !== 'category') S.categoryId = null
  S.view = 'mail'; S.mailbox = mailbox; S.filter = filter; S.query = query
  $('search').value = query
  $('search-clear').classList.toggle('hidden', !query)
  document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c.dataset.filter === filter))
  markNav((b) => b.dataset.mailbox === mailbox
    || (mailbox === 'category' && Number(b.dataset.category) === S.categoryId))
  $('admin').classList.add('hidden')
  $('list-pane').classList.remove('hidden')
  $('reader').classList.remove('hidden')
  setPane('list')
  showReaderPlaceholder()
  S.cursor = -1
  S.offset = 0
  syncUrl()
  loadList()
}

function openView(view) {
  S.view = view
  syncUrl()
  markNav((b) => b.dataset.view === view)
  $('list-pane').classList.add('hidden')
  $('reader').classList.add('hidden')
  $('admin').classList.remove('hidden')
  const titles = { members: 'members.title', settings: 'settings.title',
                   profile: 'profile.title', drive: 'drive.title', audit: 'audit.title',
                   unassigned: 'unassigned.title' }
  $('admin-title').textContent = t(titles[view] ?? 'settings.title')
  setPane('admin')
  Object.assign(render, {
    members: renderMembers, settings: renderSettings, profile: renderProfile,
    drive: () => renderDrive(), audit: renderAudit, unassigned: renderUnassigned,
  })
  const draw = render[view]
  draw()
}

function clearSearch() {
  S.query = ''
  $('search').value = ''
  $('search-clear').classList.add('hidden')
  syncUrl({ replace: true })
  loadList()
}

async function runSync() {
  const btn = $('btn-sync')
  btn.disabled = true
  btn.style.opacity = '.5'
  try {
    const result = await api('/api/sync', { method: 'POST' })
    toast(result.changed > 0 ? t('toast.synced', { n: result.changed }) : t('toast.upToDate'))
    await loadList()
  } catch (err) {
    toast(err.message)
  } finally {
    btn.disabled = false
    btn.style.opacity = ''
  }
}

// ══ Drive: my files ═════════════════════════════════════════════════════════
let driveState = { folderId: null, items: [], path: [], isHome: true }

const formatWhen = (iso) => iso
  ? new Date(iso).toLocaleDateString(localeTag(), { year: '2-digit', month: 'numeric', day: 'numeric' })
  : ''

async function renderDrive(folderId) {
  const host = $('admin-scroll')
  host.innerHTML = ''
  const wrap = el('div', 'admin-wrap wide')
  host.appendChild(wrap)
  wrap.appendChild(el('h2', 'admin-h', t('drive.title')))
  wrap.appendChild(el('p', 'admin-sub', t('drive.subtitle')))

  let data
  try {
    const query = folderId ? `?folderId=${encodeURIComponent(folderId)}` : ''
    data = await api(`/api/drive${query}`)
  } catch (err) {
    wrap.appendChild(stateBlock('folder', t('state.loadFailed'), err.message))
    return
  }
  driveState = { folderId: data.parentId, items: data.items, path: data.path, isHome: data.isHome }

  // ── Breadcrumb and actions ──
  const bar = el('div', 'drive-bar')
  const crumbs = el('div', 'crumbs')
  const homeButton = el('button', null, t('drive.home'))
  homeButton.onclick = () => renderDrive()
  crumbs.appendChild(data.path.length ? homeButton : el('span', 'current', t('drive.home')))
  data.path.forEach((folder, i) => {
    crumbs.appendChild(el('span', null, '/'))
    if (i === data.path.length - 1) crumbs.appendChild(el('span', 'current', folder.name))
    else {
      const b = el('button', null, folder.name)
      b.onclick = () => renderDrive(folder.id)
      crumbs.appendChild(b)
    }
  })
  bar.appendChild(crumbs)

  const newFolder = el('button', 'bordered')
  newFolder.append(icon('folder-plus', 'icon-sm'), document.createTextNode(t('drive.newFolder')))
  newFolder.onclick = async () => {
    const name = await askPrompt(t('drive.namePrompt'), '')
    if (!name) return
    try {
      await api('/api/drive/folder', {
        method: 'POST',
        body: JSON.stringify({ name, parentId: driveState.folderId }),
      })
      toast(t('drive.folderCreated'))
      renderDrive(driveState.folderId)
    } catch (err) { toast(err.message) }
  }

  const uploadButton = el('button', 'primary')
  uploadButton.append(icon('upload', 'icon-sm'), document.createTextNode(t('drive.upload')))
  uploadButton.onclick = () => $('drive-file-input').click()
  bar.append(newFolder, uploadButton)
  wrap.appendChild(bar)

  const dropHint = el('div', 'drive-drop hidden')
  dropHint.textContent = t('compose.dropHere')
  dropHint.id = 'drive-drop'
  wrap.appendChild(dropHint)

  // ── Listing ──
  if (data.items.length === 0) {
    wrap.appendChild(stateBlock('folder', t('drive.empty'), t('drive.emptyBody')))
  } else {
    const list = el('div', 'drive-list')
    for (const item of data.items) list.appendChild(renderDriveRow(item))
    wrap.appendChild(list)
  }

  // ── Usage ──
  try {
    const stats = await api('/api/drive/usage')
    const limit = stats.accountLimit ? t('drive.usageLimit', { limit: formatSize(stats.accountLimit) }) : ''
    const line = el('p', 'help', t('drive.usage', {
      mine: formatSize(stats.mine), used: formatSize(stats.accountUsed), limit,
    }))
    line.style.marginTop = '18px'
    wrap.appendChild(line)
    if (stats.accountLimit) {
      const track = el('div', 'usage-bar')
      const fill = el('div', 'usage-fill')
      fill.style.width = `${Math.min(100, (stats.accountUsed / stats.accountLimit) * 100).toFixed(1)}%`
      track.appendChild(fill)
      wrap.appendChild(track)
    }
  } catch { /* usage is informational; a failure must not blank the listing */ }
}

function renderDriveRow(item) {
  const row = el('div', 'drive-row')
  const glyph = icon(item.isFolder ? 'folder' : 'file', 'icon')
  if (item.isFolder) glyph.classList.add('folder-icon')
  row.appendChild(glyph)

  const name = el('div', `drive-name${item.isFolder ? ' link' : ''}`, item.name)
  if (item.isFolder) name.onclick = () => renderDrive(item.id)
  row.appendChild(name)

  row.appendChild(el('div', 'drive-meta',
    item.isFolder ? formatWhen(item.modifiedAt)
                  : `${formatSize(item.size)} · ${formatWhen(item.modifiedAt)}`))

  const actions = el('div', 'drive-actions')
  const action = (glyphName, titleKey, onClick) => {
    const b = el('button')
    b.title = t(titleKey)
    b.setAttribute('aria-label', t(titleKey))
    b.appendChild(icon(glyphName, 'icon-sm'))
    b.onclick = onClick
    actions.appendChild(b)
  }

  if (!item.isFolder) {
    action('download', 'drive.download', () => {
      window.location.href = `/api/drive/${item.id}/download`
    })
    action('paperclip', 'drive.attach', () => attachDriveFile(item))
  }
  action('pen', 'drive.rename', async () => {
    const name = await askPrompt(t('drive.namePrompt'), item.name)
    if (!name || name === item.name) return
    try {
      await api(`/api/drive/${item.id}/rename`, { method: 'POST', body: JSON.stringify({ name }) })
      toast(t('drive.renamed'))
      renderDrive(driveState.folderId)
    } catch (err) { toast(err.message) }
  })
  action('trash', 'drive.delete', async () => {
    if (!await askConfirm(t('drive.deleteConfirm', { name: item.name }), { danger: true })) return
    try {
      await api(`/api/drive/${item.id}/trash`, { method: 'POST' })
      toast(t('drive.deleted'))
      renderDrive(driveState.folderId)
    } catch (err) { toast(err.message) }
  })
  row.appendChild(actions)
  return row
}

/**
 * Upload straight from the file object: raw bytes rather than base64 in JSON,
 * which would inflate a large file by a third.
 */
async function uploadToDrive(file, parentId) {
  const params = new URLSearchParams({ name: file.name })
  if (parentId) params.set('parentId', parentId)
  return api(`/api/drive/upload?${params}`, {
    method: 'POST',
    headers: { 'content-type': file.type || 'application/octet-stream' },
    body: file,
  })
}

async function uploadFiles(files, parentId) {
  let done = 0
  for (const file of files) {
    toast(t('drive.uploading', { name: file.name }))
    try { await uploadToDrive(file, parentId); done++ }
    catch (err) { toast(err.message) }
  }
  if (done) toast(t('drive.uploaded', { n: done }))
  return done
}

/** Put a share link to the file into the open message. */
async function attachDriveFile(item) {
  try {
    const shared = await api(`/api/drive/${item.id}/link`, { method: 'POST' })
    if (!composeState.open) openCompose()
    const link = `<div><a href="${shared.link}">${item.name}</a> (${formatSize(shared.size)})</div>`
    $('c-body').focus()
    document.execCommand('insertHTML', false, link)
    toast(t('drive.linkAttached', { name: item.name }))
    scheduleDraftSave()
  } catch (err) { toast(err.message) }
}

// ══ Member settings ═════════════════════════════════════════════════════
// Written out rather than concatenated: a key built from a prefix plus a
// variable is invisible to the catalog-coverage check.
const FIELD_LABEL = {
  from: 'field.from', to: 'field.to', cc: 'field.cc',
  subject: 'field.subject', body: 'field.body', recipient: 'field.recipient',
}
const OP_LABEL = {
  contains: 'op.contains', notContains: 'op.notContains', equals: 'op.equals',
  startsWith: 'op.startsWith', endsWith: 'op.endsWith',
}
const RULE_FIELD_KEYS = Object.keys(FIELD_LABEL)
const RULE_OP_KEYS = Object.keys(OP_LABEL)

/**
 * Rule editor. Conditions and actions are posted as data; the server validates
 * every field and operator against its own whitelist, so nothing here is
 * load-bearing for safety.
 */
async function renderRulesCard() {
  const card = el('div', 'card')
  card.appendChild(el('div', 'card-h', t('rules.title')))
  const body = el('div', 'card-b')
  body.appendChild(el('p', 'help', t('rules.help')))

  const list = el('div')
  list.style.marginTop = '12px'
  const msg = el('div')
  msg.style.marginTop = '10px'
  body.append(list, msg)

  let rules = []
  const reload = async () => {
    try { rules = (await api('/api/rules')).rules || [] }
    catch (err) { notice(msg, err.message); rules = [] }
    paint()
  }

  const describe = (rule) => {
    const conds = rule.conditions
      .map((c) => `${t(FIELD_LABEL[c.field])} ${t(OP_LABEL[c.op])} "${c.value}"`)
      .join(rule.matchType === 'all' ? ' · ' : ' / ')
    const acts = []
    if (rule.actions.categoryId != null) {
      const cat = S.categories.find((c) => c.id === rule.actions.categoryId)
      acts.push(cat ? cat.name : t('rules.actionCategory'))
    }
    if (rule.actions.read) acts.push(t('rules.actionRead'))
    if (rule.actions.star) acts.push(t('rules.actionStar'))
    if (rule.actions.archive) acts.push(t('rules.actionArchive'))
    return `${conds}  →  ${acts.join(', ')}`
  }

  function paint() {
    list.innerHTML = ''
    if (rules.length === 0) list.appendChild(el('div', 'help', t('rules.none')))
    for (const rule of rules) {
      const row = el('div', 'rule-row')
      const head = el('div', 'rule-head')
      const toggle = el('input')
      toggle.type = 'checkbox'
      toggle.checked = rule.enabled
      toggle.title = t('rules.enabled')
      toggle.onchange = async () => {
        try {
          await api(`/api/rules/${rule.id}/enabled`, {
            method: 'POST', body: JSON.stringify({ enabled: toggle.checked }),
          })
          await reload()
        } catch (err) { notice(msg, err.message) }
      }
      const name = el('span', 'rule-name', rule.name)
      if (!rule.enabled) name.style.color = 'var(--text-3)'
      const edit = el('button', 'bordered rule-edit', t('cat.rename'))
      edit.onclick = () => openEditor(rule)
      const remove = el('button', 'bordered rule-delete', t('cat.delete'))
      remove.classList.add('danger-text')
      remove.onclick = async () => {
        if (!await askConfirm(t('rules.deleteConfirm', { name: rule.name }), { danger: true })) return
        try { await api(`/api/rules/${rule.id}/delete`, { method: 'POST' }); await reload() }
        catch (err) { notice(msg, err.message) }
      }
      head.append(toggle, name, edit, remove)
      row.append(head, el('div', 'rule-summary', describe(rule)))
      list.appendChild(row)
    }
  }

  function openEditor(rule) {
    const editing = rule ?? {
      name: '', matchType: 'all',
      conditions: [{ field: 'from', op: 'contains', value: '' }],
      actions: { categoryId: null, read: false, star: false, archive: false },
    }
    const form = el('div', 'rule-row')
    form.id = 'rule-editor'
    form.style.borderColor = 'var(--accent)'

    const nameInput = el('input')
    nameInput.id = 'rule-name'
    nameInput.placeholder = t('rules.name')
    nameInput.value = editing.name
    form.appendChild(nameInput)

    const matchSel = el('select')
    for (const [value, key] of [['all', 'rules.matchAll'], ['any', 'rules.matchAny']]) {
      const opt = el('option', null, t(key)); opt.value = value; matchSel.appendChild(opt)
    }
    matchSel.value = editing.matchType
    const matchRow = el('div', 'cond-row')
    matchRow.append(el('span', 'help', t('rules.match')), matchSel)
    form.appendChild(matchRow)

    const condHost = el('div')
    const conditions = editing.conditions.map((c) => ({ ...c }))
    const paintConds = () => {
      condHost.innerHTML = ''
      conditions.forEach((cond, i) => {
        const row = el('div', 'cond-row')
        const field = el('select')
        field.className = 'cond-field'
        for (const f of RULE_FIELD_KEYS) {
          const o = el('option', null, t(FIELD_LABEL[f])); o.value = f; field.appendChild(o)
        }
        field.value = cond.field
        field.onchange = () => { cond.field = field.value }
        const op = el('select')
        op.className = 'cond-op'
        for (const o2 of RULE_OP_KEYS) {
          const o = el('option', null, t(OP_LABEL[o2])); o.value = o2; op.appendChild(o)
        }
        op.value = cond.op
        op.onchange = () => { cond.op = op.value }
        const value = el('input')
        value.className = 'cond-value'
        value.value = cond.value
        value.oninput = () => { cond.value = value.value }
        const drop = el('button', 'bordered', '×')
        drop.onclick = () => { conditions.splice(i, 1); paintConds() }
        drop.disabled = conditions.length === 1
        row.append(field, op, value, drop)
        condHost.appendChild(row)
      })
    }
    paintConds()
    form.append(el('div', 'help', t('rules.conditions')), condHost)
    const addCond = el('button', 'bordered', t('rules.addCondition'))
    addCond.style.marginTop = '8px'
    addCond.onclick = () => { conditions.push({ field: 'from', op: 'contains', value: '' }); paintConds() }
    form.appendChild(addCond)

    form.appendChild(el('div', 'help', t('rules.actions')))
    const catSel = el('select')
    const none = el('option', null, t('rules.noCategory')); none.value = ''; catSel.appendChild(none)
    for (const c of S.categories) {
      const o = el('option', null, c.name); o.value = String(c.id); catSel.appendChild(o)
    }
    catSel.id = 'rule-category'
    catSel.value = editing.actions.categoryId == null ? '' : String(editing.actions.categoryId)
    const catRow = el('div', 'cond-row')
    catRow.append(el('span', 'help', t('rules.actionCategory')), catSel)
    form.appendChild(catRow)

    const flags = {}
    for (const [key, label] of [['read', 'rules.actionRead'], ['star', 'rules.actionStar'],
                                ['archive', 'rules.actionArchive']]) {
      const row = el('label', 'cond-row')
      const box = el('input'); box.type = 'checkbox'; box.checked = Boolean(editing.actions[key])
      box.id = `rule-action-${key}`
      row.append(box, el('span', null, t(label)))
      flags[key] = box
      form.appendChild(row)
    }

    const bar = el('div')
    bar.style.cssText = 'display:flex;gap:8px;margin-top:12px'
    const save = el('button', 'primary', t('rules.save'))
    save.id = 'rule-save'
    save.onclick = async () => {
      notice(msg, '')
      const payload = {
        name: nameInput.value,
        matchType: matchSel.value,
        conditions,
        actions: {
          categoryId: catSel.value ? Number(catSel.value) : null,
          read: flags.read.checked, star: flags.star.checked, archive: flags.archive.checked,
        },
      }
      try {
        await api(rule ? `/api/rules/${rule.id}` : '/api/rules', {
          method: 'POST', body: JSON.stringify(payload),
        })
        form.remove()
        await reload()
      } catch (err) { notice(msg, err.message) }
    }
    const cancel = el('button', 'bordered', t('rules.cancel'))
    cancel.onclick = () => form.remove()
    bar.append(save, cancel)
    form.appendChild(bar)
    list.appendChild(form)
    nameInput.focus()
  }

  const bar = el('div')
  bar.style.cssText = 'display:flex;gap:8px;margin-top:14px;flex-wrap:wrap'
  const add = el('button', 'primary', t('rules.add'))
  add.id = 'rules-add'
  add.onclick = () => openEditor(null)
  const applyNow = el('button', 'bordered', t('rules.applyNow'))
  applyNow.id = 'rules-apply'
  applyNow.onclick = async () => {
    applyNow.disabled = true
    try {
      const r = await api('/api/rules/apply', { method: 'POST' })
      toast(t('rules.applied', { scanned: r.scanned, changed: r.changed }))
      await loadCategories()
    } catch (err) { notice(msg, err.message) }
    finally { applyNow.disabled = false }
  }
  bar.append(add, applyNow)
  body.appendChild(bar)

  await reload()
  card.appendChild(body)
  return card
}

/**
 * Tab strip over a set of panels. The selection lives in the query string, so a
 * reload — or the re-render after saving — returns to the same panel.
 */
function renderTabs(host, tabs, { param = 'tab' } = {}) {
  const params = new URLSearchParams(location.search)
  const wanted = params.get(param)
  const active = tabs.some((tab) => tab.id === wanted) ? wanted : tabs[0].id

  const bar = el('div', 'tabs')
  bar.setAttribute('role', 'tablist')
  const panels = {}

  for (const tab of tabs) {
    const btn = el('button', 'tab', t(tab.label))
    btn.setAttribute('role', 'tab')
    btn.setAttribute('aria-selected', String(tab.id === active))
    btn.classList.toggle('on', tab.id === active)
    btn.onclick = () => {
      if (tab.id === active) return
      const next = new URLSearchParams(location.search)
      next.set(param, tab.id)
      // replaceState: switching tabs is a refinement of one screen, not a place
      // to have to press Back through.
      history.replaceState({}, '', `${location.pathname}?${next}`)
      render[S.view]?.()
    }
    bar.appendChild(btn)

    const panel = el('div')
    panel.setAttribute('role', 'tabpanel')
    panel.hidden = tab.id !== active
    panels[tab.id] = panel
  }

  host.appendChild(bar)
  for (const tab of tabs) host.appendChild(panels[tab.id])
  return panels
}

/**
 * Credentials for mail clients, one per device.
 *
 * Separate from the sign-in password because a client keeps its copy on disk
 * and sends it on every connection. Creating one takes the sign-in password
 * out of the mail path entirely, so the card says so before the member commits.
 */
async function renderAppPasswords() {
  const card = el('div', 'card')
  card.appendChild(el('div', 'card-h', t('appPassword.title')))
  const body = el('div', 'card-b')
  body.appendChild(el('p', 'help', t('appPassword.help')))

  const msg = el('div')
  msg.style.marginTop = '12px'
  body.appendChild(msg)

  const table = el('table')
  table.style.marginTop = '14px'
  const head = el('tr')
  for (const key of ['appPassword.label', 'appPassword.created', 'appPassword.lastUsed', '']) {
    head.appendChild(el('th', null, key ? t(key) : ''))
  }
  table.appendChild(el('thead')).appendChild(head)
  const rows = el('tbody')
  table.appendChild(rows)
  body.appendChild(table)

  const create = el('button', 'primary', t('appPassword.create'))
  create.style.marginTop = '14px'
  body.appendChild(create)
  card.appendChild(body)

  async function paint() {
    rows.innerHTML = ''
    let list = []
    try { list = (await api('/api/profile/app-passwords')).passwords }
    catch (err) { notice(msg, err.message); return }

    if (list.length === 0) {
      const empty = el('tr')
      const cell = el('td', 'help', t('appPassword.none'))
      cell.colSpan = 4
      empty.appendChild(cell)
      rows.appendChild(empty)
      return
    }
    for (const item of list) {
      const tr = el('tr')
      tr.appendChild(el('td', null, item.label))
      tr.appendChild(el('td', 'mono', item.createdAt.slice(0, 10)))
      tr.appendChild(el('td', 'help', item.lastUsedAt ?? t('appPassword.neverUsed')))
      const actions = el('td')
      const revoke = el('button', 'bordered danger-text', t('appPassword.revoke'))
      revoke.onclick = async () => {
        if (!await askConfirm(t('appPassword.revokeConfirm', { label: item.label }),
                              { danger: true })) return
        await withBusy(revoke, null, async () => {
          try {
            await api(`/api/profile/app-passwords/${item.id}/revoke`, { method: 'POST' })
            await paint()
          } catch (err) { notice(msg, err.message) }
        })
      }
      actions.appendChild(revoke)
      tr.appendChild(actions)
      rows.appendChild(tr)
    }
  }

  create.onclick = async () => {
    const label = await askPrompt(t('appPassword.labelPrompt'), '')
    if (label === null || !label.trim()) return
    await withBusy(create, null, async () => {
      try {
        const made = await api('/api/profile/app-passwords', {
          method: 'POST', body: JSON.stringify({ label }),
        })
        // Shown once: nothing stored can produce it again.
        await showAlert(t('appPassword.createdBody', { label, secret: made.secret }))
        await paint()
      } catch (err) { notice(msg, err.message) }
    })
  }

  await paint()
  return card
}

/**
 * Setup instructions, one panel per client.
 *
 * Written out rather than detected: autoconfiguration is answered per domain,
 * and this domain also carries accounts whose mail is not here at all -- they
 * would be handed settings that cannot work for them.
 *
 * The values come from settings, so an operator who moves a port does not
 * leave every member following instructions that used to be right.
 */
function renderClientGuide(cfg) {
  const card = el('div', 'card')
  card.appendChild(el('div', 'card-h', t('guide.title')))
  const body = el('div', 'card-b')

  const host = cfg.host || ''
  const imap = cfg.imapPort || '993'
  const smtp = cfg.smtpPort || '465'
  const address = S.me.alias || ''

  if (!host) {
    const warn = el('div')
    notice(warn, t('guide.noHost'), 'warn')
    body.appendChild(warn)
    card.appendChild(body)
    return card
  }

  body.appendChild(el('p', 'help', t('guide.help')))

  // The same values every panel refers to, stated once and copyable.
  const summary = el('div', 'card')
  summary.style.marginTop = '14px'
  const table = el('table')
  const rows = el('tbody')
  // Monospace only where the value is typed into another program; the last
  // two rows are prose, and setting them in it just spaces the words out.
  for (const [label, value, verbatim] of [
    ['guide.address', address, true],
    ['guide.username', address, true],
    ['guide.imapServer', `${host}:${imap}`, true],
    ['guide.smtpServer', `${host}:${smtp}`, true],
    ['guide.security', t('guide.securityValue'), false],
    ['guide.password', t('guide.passwordValue'), false],
  ]) {
    const tr = el('tr')
    const name = el('td', 'help', t(label))
    name.style.width = '160px'
    tr.appendChild(name)
    tr.appendChild(el('td', verbatim ? 'mono' : null, value))
    rows.appendChild(tr)
  }
  table.appendChild(rows)
  summary.appendChild(table)
  body.appendChild(summary)

  const panels = renderTabs(body, [
    { id: 'apple', label: 'guide.apple' },
    { id: 'thunderbird', label: 'guide.thunderbird' },
    { id: 'outlook', label: 'guide.outlook' },
    { id: 'ios', label: 'guide.ios' },
  ], { param: 'client' })

  const steps = {
    apple: ['guide.apple1', 'guide.apple2', 'guide.apple3', 'guide.apple4', 'guide.apple5'],
    thunderbird: ['guide.tb1', 'guide.tb2', 'guide.tb3', 'guide.tb4'],
    outlook: ['guide.ol1', 'guide.ol2', 'guide.ol3'],
    ios: ['guide.ios1', 'guide.ios2', 'guide.ios3', 'guide.ios4'],
  }
  const params = { host, imap, smtp, address }
  for (const [id, keys] of Object.entries(steps)) {
    const list = el('ol')
    list.style.cssText = 'margin:4px 0 0;padding-left:20px;font-size:12.5px;line-height:1.8'
    for (const key of keys) {
      const item = el('li', null, t(key, params))
      item.style.whiteSpace = 'pre-line'
      list.appendChild(item)
    }
    panels[id].appendChild(list)
  }

  card.appendChild(body)
  return card
}

async function renderProfile() {
  const host = $('admin-scroll')
  host.innerHTML = ''
  const wrap = el('div', 'admin-wrap')
  host.appendChild(wrap)
  wrap.appendChild(el('h2', 'admin-h', t('profile.title')))

    { id: 'clients', label: 'appPassword.title' },
    { id: 'categories', label: 'cat.title' },

  const account = el('div', 'card')

  const nameRow = el('div')
  nameRow.style.cssText = 'display:flex;gap:8px;max-width:420px'
  const nameInput = el('input')

  nameInput.maxLength = 80
  const nameSave = el('button', 'bordered', t('profile.save'))
  const nameMsg = el('div')
  nameMsg.style.marginTop = '10px'
  nameSave.onclick = async () => {
    nameSave.disabled = true
    try {
      const result = await api('/api/profile/name', {
        method: 'POST', body: JSON.stringify({ displayName: nameInput.value }),
      })
      S.me.displayName = result.displayName
      $('me-name').textContent = result.displayName

    } catch (err) { notice(nameMsg, err.message) }

  // ── Password ──

  const pwBody = el('div', 'card-b')

  pwFields.style.maxWidth = '420px'
  const pwInputs = {}
  for (const [key, label] of [
    ['current', 'profile.currentPassword'],
    ['next', 'profile.newPassword'],
    ['confirm', 'profile.newPasswordConfirm'],

  const pwMsg = el('div')
  pwMsg.style.marginTop = '12px'
  pwBody.appendChild(pwMsg)

  const pwSave = el('button', 'primary', t('profile.changePassword'))

  pwSave.onclick = async () => {

      notice(pwMsg, t('auth.passwordMismatch'))

      return

    pwSave.disabled = true

          currentPassword: pwInputs.current.value,

      }
      const remove = el('button', 'bordered cat-delete', t('cat.delete'))
      remove.classList.add('danger-text')
      remove.onclick = async () => {
        if (!await askConfirm(t('cat.deleteConfirm', { name: category.name }), { danger: true })) return

          await api(`/api/categories/${category.id}/delete`, { method: 'POST' })

  paintCatEditor()

  addRow.style.cssText = 'display:flex;gap:8px;margin-top:14px;max-width:460px'
  const addName = el('input')

  addName.placeholder = t('cat.name')
  const addColor = el('select')
  addColor.id = 'cat-new-color'
  for (const c of Object.keys(CATEGORY_HUES)) addColor.appendChild(el('option', null, c)).value = c
  const addBtn = el('button', 'primary', t('cat.add'))
  addBtn.id = 'cat-add'
  addBtn.onclick = async () => {
    notice(catMsg, '')
    try {
      await api('/api/categories', {
        method: 'POST', body: JSON.stringify({ name: addName.value, color: addColor.value }),
      })
      addName.value = ''
      await loadCategories(); paintCatEditor()
    } catch (err) { notice(catMsg, err.message) }
  }
  addRow.append(addName, addColor, addBtn)
  catBody.appendChild(addRow)
  catCard.appendChild(catBody)
  panels.clients.appendChild(await renderAppPasswords())
  try {
    panels.clients.appendChild(renderClientGuide(await api('/api/profile/mail-settings')))
  } catch { /* the card is guidance; its absence is not an error */ }

  panels.categories.appendChild(catCard)

  // ── Rules ──
  panels.rules.appendChild(await renderRulesCard())

  const card = el('div', 'card')
  card.appendChild(el('div', 'card-h', t('profile.signature')))
  const body = el('div', 'card-b')
  body.appendChild(el('p', 'help', t('profile.signatureHelp')))

  // The same editor as the composer, so a signature can carry a link or bold.
  const toolbar = el('div', 'c-toolbar')
  toolbar.style.cssText = 'border:1px solid var(--line);border-bottom:none;border-radius:var(--r) var(--r) 0 0;margin-top:10px'
  const editor = el('div')
  editor.id = 'sig-body'
  editor.contentEditable = 'true'
  editor.setAttribute('role', 'textbox')
  editor.style.cssText = 'border:1px solid var(--line);border-radius:0 0 var(--r) var(--r);'
    + 'padding:12px;min-height:110px;outline:none;font-size:13.5px;line-height:1.6'
  editor.innerHTML = S.me.signature || ''

  const commands = [
    ['bold', 'i-bold', 'compose.bold'], ['italic', 'i-italic', 'compose.italic'],
    ['underline', 'i-underline', 'compose.underline'],
  ]
  for (const [cmd, glyph, key] of commands) {
    const b = el('button')
    b.title = t(key)
    b.appendChild(icon(glyph.replace('i-', ''), 'icon-sm'))
    b.addEventListener('mousedown', (e) => {
      e.preventDefault()
      editor.focus()
      document.execCommand(cmd, false)
    })
    toolbar.appendChild(b)
  }
  const linkButton = el('button')
  linkButton.title = t('compose.link')
  linkButton.appendChild(icon('link', 'icon-sm'))
  linkButton.addEventListener('mousedown', (e) => {
    e.preventDefault()
    editor.focus()
    const url = prompt(t('compose.linkPrompt'), 'https://')
    if (!url || !/^(https?:|mailto:)/i.test(url.trim())) {
      if (url) toast(t('mailbox.invalidLink'))
      return
    }
    document.execCommand('createLink', false, url.trim())
  })
  toolbar.appendChild(linkButton)

  body.append(toolbar, editor)

  const msgHost = el('div')
  msgHost.style.marginTop = '12px'
  const save = el('button', 'primary', t('profile.save'))
  save.style.marginTop = '14px'
  save.onclick = async () => {
    save.disabled = true
    try {
      const host = document.createElement('div')
      host.innerHTML = editor.innerHTML
      const result = await api('/api/profile/signature', {
        method: 'POST', body: JSON.stringify({ signature: cleanFragment(host) }),
      })
      S.me.signature = result.signature
      editor.innerHTML = result.signature || ''
      toast(t('profile.saved'))
    } catch (err) { notice(msgHost, err.message) }
    finally { save.disabled = false }
  }
  body.append(msgHost, save)
  card.appendChild(body)
  panels.signature.appendChild(card)
}

// ══ Admin: members ══════════════════════════════════════════════════════
async function renderMembers() {
  const host = $('admin-scroll')
  host.innerHTML = ''
  const wrap = el('div', 'admin-wrap')
  host.appendChild(wrap)
  wrap.appendChild(el('h2', 'admin-h', t('members.title')))
  wrap.appendChild(el('p', 'admin-sub', t('members.subtitle')))

  let data
  try { data = await api('/api/admin/users') }
  catch (err) { wrap.appendChild(stateBlock('empty', t('state.loadFailed'), err.message)); return }

  const pending = data.users.filter((u) => u.status === 'pending')
  $('pending-badge').textContent = pending.length
  $('pending-badge').classList.toggle('hidden', pending.length === 0)

  const card = el('div', 'card')
  const cardHead = el('div', 'card-h')
  cardHead.append(icon('users', 'icon-sm'), document.createTextNode(t('members.count', { n: data.users.length })))
  card.appendChild(cardHead)

  const table = el('table')
  const thead = el('thead')
  const hr = el('tr')
  for (const key of ['members.colName', 'members.colAddress', 'members.colStatus', null]) {
    hr.appendChild(el('th', null, key ? t(key) : ''))
  }
  thead.appendChild(hr); table.appendChild(thead)

  const tbody = el('tbody')
  for (const u of data.users) {
    const tr = el('tr')

    const nameCell = el('td')
    const nameWrap = el('div')
    nameWrap.style.cssText = 'display:flex;align-items:center;gap:9px'
    nameWrap.append(avatarFor(u.display_name, u.alias_email || u.username),
                    el('span', null, u.display_name))
    nameCell.appendChild(nameWrap)
    tr.appendChild(nameCell)

    const addrCell = el('td', 'mono')
    const requested = u.alias_local
      ? `${u.alias_local}@${u.alias_domain ?? '…'}`
      : '—'
    addrCell.textContent = u.alias_email || requested
    if (!u.alias_email && u.alias_local) addrCell.style.color = 'var(--text-3)'
    tr.appendChild(addrCell)

    const statusCell = el('td')
    const label = t({ pending: 'members.statusPending', active: 'members.statusActive',
                      deactivated: 'members.statusDeactivated' }[u.status])
    statusCell.appendChild(el('span', `tag ${u.status}`, label))
    if (u.provision_error) {
      // Active with an error means the address delivers but cannot send yet.
      // A warning, not a failure.
      const partial = u.status === 'active'
      const warn = el('div', 'help', t(partial ? 'members.sendAsMissing' : 'members.provisionFailed'))
      warn.style.color = partial ? 'var(--warn)' : 'var(--danger)'
      warn.title = u.provision_error
      statusCell.appendChild(warn)
      if (partial) {
        const how = el('div', 'help', t('members.sendAsMissingHelp'))
        statusCell.appendChild(how)
      }
    }
    tr.appendChild(statusCell)

    const actionCell = el('td')
    actionCell.style.textAlign = 'right'
    const bar = el('div')
    bar.style.cssText = 'display:inline-flex;gap:6px'
    if (u.status === 'pending') {
      const ok = el('button', 'primary', t('members.approve'))
      ok.onclick = () => memberAction(u.id, 'approve', u.display_name)
      const no = el('button', 'bordered', t('members.reject'))
      no.onclick = () => memberAction(u.id, 'reject', u.display_name)
      bar.append(ok, no)
    } else if (u.status === 'active' && u.id !== S.me.id && !u.is_admin) {
      const off = el('button', 'bordered', t('members.deactivate'))
      off.classList.add('danger-text')
      off.onclick = () => memberAction(u.id, 'deactivate', u.display_name)
      bar.append(off)
    }
    actionCell.appendChild(bar)
    tr.appendChild(actionCell)
    tbody.appendChild(tr)
  }
  table.appendChild(tbody)
  card.appendChild(table)
  wrap.appendChild(card)

}

async function memberAction(id, verb, who) {
  const action = t({ approve: 'members.approve', reject: 'members.reject',
                     deactivate: 'members.deactivate' }[verb])
  if (verb !== 'approve' && !await askConfirm(t('members.confirmAction', { who, action }))) return
  try {
    const result = await api(`/api/admin/users/${id}/${verb}`, { method: 'POST' })
    toast(result.note
      || (result.alias ? t('toast.approved', { alias: result.alias }) : t('toast.actionDone', { action })))
    renderMembers()
  } catch (err) {
    void showAlert(err.message)
  }
}

// ══ Admin: unassigned queue ═════════════════════════════════════════════
/**
 * Mail whose recipient could not be resolved: a queue an operator works
 * through, countable from the sidebar.
 *
 * Discarded and draft mail never reaches it. Assigning something already in the
 * Trash accepts the choice and changes nothing visible, because every mailbox
 * view excludes the Trash.
 */
async function renderUnassigned() {
  const host = $('admin-scroll')
  host.innerHTML = ''
  const wrap = el('div', 'admin-wrap')
  host.appendChild(wrap)
  wrap.appendChild(el('h2', 'admin-h', t('unassigned.title')))
  wrap.appendChild(el('p', 'admin-sub', t('unassigned.subtitle')))

  let data
  try { data = await api('/api/admin/unassigned') }
  catch (err) { wrap.appendChild(stateBlock('empty', t('state.loadFailed'), err.message)); return }

  paintUnassignedBadge(data.messages.length)

  if (data.messages.length === 0) {
    wrap.appendChild(stateBlock('check', t('unassigned.emptyTitle'), t('unassigned.emptyBody')))
    return
  }

  const card = el('div', 'card')
  const head = el('div', 'card-h')
  head.append(icon('inbox-down', 'icon-sm'),
              document.createTextNode(t('members.unassignedCount', { n: data.messages.length })))
  card.appendChild(head)
  const body = el('div', 'card-b')
  body.appendChild(el('p', 'help', t('members.unassignedHelp')))

  for (const msg of data.messages) {
    const row = el('div')
    row.style.cssText = 'display:flex;gap:12px;align-items:center;padding:11px 0;'
      + 'border-bottom:1px solid var(--line-soft);flex-wrap:wrap'
    const info = el('div')
    info.style.cssText = 'flex:1;min-width:200px'
    const subj = el('div', null, msg.subject || t('reader.noSubject'))
    subj.style.cssText = 'font-size:12.5px;font-weight:600;overflow:hidden;'
      + 'text-overflow:ellipsis;white-space:nowrap'
    info.append(subj, el('div', 'help', `${msg.from} · ${fullTime(msg.date)}`))

    // The addresses it was actually sent to: the evidence an operator needs to
    // decide, and the reason it could not be decided automatically.
    const to = [...(msg.to || []), ...(msg.cc || [])]
    if (to.length) info.appendChild(el('div', 'help mono', to.join(', ')))

    const pick = el('select')
    pick.style.cssText = 'width:220px;flex:none'
    pick.appendChild(new Option(t('members.pickOwner'), ''))
    for (const a of data.aliases) pick.appendChild(new Option(a, a))
    pick.onchange = async () => {
      if (!pick.value) return
      pick.disabled = true
      try {
        await api('/api/admin/assign', {
          method: 'POST', body: JSON.stringify({ gmailId: msg.id, alias: pick.value }),
        })
        toast(t('toast.assigned'))
        renderUnassigned()
      } catch (err) { toast(err.message); pick.disabled = false }
    }
    row.append(info, pick)
    body.appendChild(row)
  }
  card.appendChild(body)
  wrap.appendChild(card)
}

function paintUnassignedBadge(n) {
  const badge = $('unassigned-badge')
  if (!badge) return
  badge.textContent = n
  badge.classList.toggle('hidden', n === 0)
}

/** Kept current in the sidebar without opening the screen. */
async function refreshUnassignedBadge() {
  if (!S.me?.isAdmin) return
  try { paintUnassignedBadge((await api('/api/admin/unassigned')).messages.length) }
  catch { /* the badge is not worth surfacing an error for */ }
}

// ══ Admin: audit log ════════════════════════════════════════════════════
const ACTION_LABEL = {
  'signin.ok': 'act.signin.ok', 'signin.fail': 'act.signin.fail',
  'signin.throttled': 'act.signin.throttled', 'signout': 'act.signout',
  'message.read': 'act.message.read', 'message.send': 'act.message.send',
  'message.action': 'act.message.action',
  'member.approve': 'act.member.approve', 'member.reject': 'act.member.reject',
  'member.deactivate': 'act.member.deactivate', 'member.assign': 'act.member.assign',
  'settings.save': 'act.settings.save',
  'google.connect': 'act.google.connect', 'google.disconnect': 'act.google.disconnect',
  'account.alias': 'act.account.alias', 'account.password': 'act.account.password',
  'audit.view': 'act.audit.view',
}
const actionLabel = (name) => (ACTION_LABEL[name] ? t(ACTION_LABEL[name]) : name)

/**
 * The access record, newest first. Filtered and paged server-side: this is the
 * table that grows without bound.
 */
/** Rows that fit the window, so a page ends where the screen does. */
function auditPageSize() {
  const ROW = 42        // one table row: 12px padding either side, 18px line
  const CHROME = 330    // heading, filters, table head, footer, card padding
  return Math.max(10, Math.min(200, Math.floor((window.innerHeight - CHROME) / ROW)))
}

/** Removed before the view is rebuilt, so listeners cannot accumulate. */
let auditResize = null

async function renderAudit() {
  const host = $('admin-scroll')
  host.innerHTML = ''
  const wrap = el('div', 'admin-wrap')
  host.appendChild(wrap)
  wrap.appendChild(el('h2', 'admin-h', t('audit.title')))
  wrap.appendChild(el('p', 'admin-sub', t('audit.help')))

  const controls = el('div', 'cond-row')
  controls.style.marginBottom = '14px'
  const actorSel = el('select')
  const actionSel = el('select')
  const sinceInput = el('input')
  sinceInput.type = 'date'
  for (const sel of [actorSel, actionSel]) sel.style.maxWidth = '220px'
  sinceInput.style.maxWidth = '170px'
  controls.append(actorSel, actionSel, sinceInput)
  wrap.appendChild(controls)

  const card = el('div', 'card')
  const table = el('table')
  const thead = el('thead')
  const hr = el('tr')
  for (const key of ['audit.when', 'audit.actor', 'audit.action', 'audit.target', 'audit.ip']) {
    hr.appendChild(el('th', null, t(key)))
  }
  thead.appendChild(hr)
  table.appendChild(thead)
  const tbody = el('tbody')
  table.appendChild(tbody)
  card.appendChild(table)
  wrap.appendChild(card)

  const footer = el('div')
  footer.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px'
  wrap.appendChild(footer)

  if (auditResize) window.removeEventListener('resize', auditResize)

  let offset = 0
  let limit = auditPageSize()
  let facetsPainted = false

  async function load({ reset = false } = {}) {
    if (reset) offset = 0
    tbody.innerHTML = ''
    const params = new URLSearchParams({ limit: String(limit), offset: String(offset) })
    if (actorSel.value) params.set('actor', actorSel.value)
    if (actionSel.value) params.set('action', actionSel.value)
    if (sinceInput.value) params.set('since', sinceInput.value)

    let data
    try { data = await api(`/api/admin/audit?${params}`) }
    catch (err) { wrap.appendChild(stateBlock('empty', t('state.loadFailed'), err.message)); return }

    if (!facetsPainted) {
      facetsPainted = true
      for (const [sel, values, labelOf] of [
        [actorSel, data.actors, (v) => v],
        [actionSel, data.actions, actionLabel],
      ]) {
        const any = el('option', null, t('audit.all'))
        any.value = ''
        sel.appendChild(any)
        for (const value of values) {
          const opt = el('option', null, labelOf(value))
          opt.value = value
          sel.appendChild(opt)
        }
        sel.onchange = () => load({ reset: true })
      }
      sinceInput.onchange = () => load({ reset: true })
    }

    if (data.rows.length === 0) {
      const row = el('tr')
      const cell = el('td', 'help', t('audit.empty'))
      cell.colSpan = 5
      row.appendChild(cell)
      tbody.appendChild(row)
    }

    for (const entry of data.rows) {
      const tr = el('tr')
      tr.appendChild(el('td', 'mono', entry.at))
      tr.appendChild(el('td', null, entry.actor || '—'))
      const action = el('td', null, actionLabel(entry.action))
      if (entry.action.startsWith('signin.fail') || entry.action === 'signin.throttled') {
        action.style.color = 'var(--warn)'
      }
      tr.appendChild(action)
      const target = el('td', 'mono', entry.target || '—')
      if (entry.detail) target.title = entry.detail
      tr.appendChild(target)
      tr.appendChild(el('td', 'mono', entry.ip || '—'))
      tbody.appendChild(tr)
    }

    footer.innerHTML = ''
    footer.appendChild(el('span', 'help', t('audit.total', { n: data.total })))
    footer.appendChild(el('span', 'help', t('audit.retention', { days: 365 })))

    const pager = el('div', 'pager')
    pager.style.marginLeft = 'auto'
    const prev = el('button', 'bordered', '‹')
    prev.title = t('list.prevPage')
    prev.disabled = offset === 0
    prev.onclick = () => { offset = Math.max(0, offset - limit); void load() }
    const next = el('button', 'bordered', '›')
    next.title = t('list.nextPage')
    next.disabled = !data.hasMore
    next.onclick = () => { offset += limit; void load() }
    const from = data.rows.length ? offset + 1 : 0
    pager.append(prev, el('span', 'help', t('list.range', { from, to: offset + data.rows.length })), next)
    footer.appendChild(pager)
  }

  // A resize changes how many rows fit; reloading from the top of the current
  // page keeps the reader where they were.
  let resizeTimer = null
  auditResize = () => {
    clearTimeout(resizeTimer)
    resizeTimer = setTimeout(() => {
      const next = auditPageSize()
      if (next === limit) return
      limit = next
      void load()
    }, 200)
  }
  window.addEventListener('resize', auditResize)

  await load({ reset: true })
}

// ══ Admin: system settings ══════════════════════════════════════════════
/**
 * The setup checklist. Every failure it walks past — an API left disabled, a
 * mismatched redirect URI, an operator address colliding with the shared
 * account — presents as an empty inbox with nothing to explain it, so each step
 * carries its console link and, where knowable, its own state.
 */
/** The redirect URI with a copy button, shown at the step that has to paste it. */
function redirectUriRow(uri) {
  const wrap = el('div')
  wrap.style.marginTop = '9px'
  wrap.appendChild(el('div', 'step-dh', t('settings.redirectTitle')))
  const row = el('div')
  row.style.cssText = 'display:flex;gap:8px;margin-top:6px'
  const input = el('input', 'mono')
  input.readOnly = true
  input.value = uri
  input.onfocus = () => input.select()
  const copy = el('button', 'bordered', t('settings.copy'))
  copy.style.flex = 'none'
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(uri); toast(t('toast.copied')) }
    catch { input.select(); toast(t('toast.copyManually')) }
  }
  row.append(input, copy)
  wrap.appendChild(row)
  return wrap
}

function renderSetupGuide(data, cfg) {
  const card = el('div', 'card')
  card.appendChild(el('div', 'card-h', t('setup.title')))
  const body = el('div', 'card-b')
  body.appendChild(el('p', 'help', t('setup.help')))

  // Every console link opens whichever project is selected; the detail text
  // says to check the picker. Pinning one from the stored client id would name
  // the project being replaced.
  const CLOUD = 'https://console.cloud.google.com'
  const ADMIN = 'https://admin.google.com/ac'
  const lib = (api) => `${CLOUD}/apis/library/${api}.googleapis.com`

  const hasClient = Boolean(cfg.google_client_id && cfg.google_client_secret)
  const hasFields = Boolean(cfg.org_domain && cfg.shared_account_email) && hasClient
  const synced = Boolean(data.lastSyncedAt)
  const myAlias = (S.me.alias || '').toLowerCase()
  const shared = (cfg.shared_account_email || '').toLowerCase()

  const steps = [
    { title: 'setup.s1', help: 'setup.s1help', done: Boolean(cfg.google_client_id),
      // Two links, not three: the audience is asked for inside the client
      // flow, and its own page is a metrics dashboard with nothing to set.
      links: [['setup.s1c', `${CLOUD}/projectcreate`],
              ['setup.s1a', `${CLOUD}/auth/clients`]],
      details: [
        ['h', 'setup.s1h0'], ['d', 'setup.s1d0'],
        ['h', 'setup.s1h1'], ['d', 'setup.s1d1'], ['d', 'setup.s1d1b'], ['d', 'setup.s1d2'],
        ['d', 'setup.s1d3'], ['d', 'setup.s1d4'], ['d', 'setup.s1d5'], ['uri'],
        ['d', 'setup.s1d6'],
      ] },
    { title: 'setup.s2', help: 'setup.s2help',
      done: synced && !data.lastSyncError,
      error: data.lastSyncError ? t('setup.s2err', { msg: data.lastSyncError }) : null,
      links: [['setup.s2a', lib('gmail')], ['setup.s2b', lib('admin')],
              ['setup.s2c', lib('drive')]],
      details: [
        ['h', 'setup.s2h1'], ['d', 'setup.s2d1'], ['d', 'setup.s2d2'], ['d', 'setup.s2d3'],
        ['d', 'setup.s2d4'], ['d', 'setup.s2d5'], ['d', 'setup.s2d6'],
      ] },
    { title: 'setup.s3', help: 'setup.s3help', done: hasFields,
      details: [
        ['h', 'setup.s3h1'], ['d', 'setup.s3d1'], ['d', 'setup.s3d2'],
        ['d', 'setup.s3d3'], ['d', 'setup.s3d4'],
      ] },
    { title: 'setup.s4', help: 'setup.s4help', done: Boolean(cfg.connected),
      details: [
        ['h', 'setup.s4h1'], ['d', 'setup.s4d1'], ['d', 'setup.s4d2'], ['d', 'setup.s4d3'],
      ] },
    { title: 'setup.s5', help: 'setup.s5help', done: synced,
      details: [
        ['h', 'setup.s5h1'], ['d', 'setup.s5d1'], ['d', 'setup.s5d2'], ['d', 'setup.s5d3'],
      ] },
    { title: 'setup.s6', help: 'setup.s6help', done: null,
      links: [['setup.s6a', `${ADMIN}/apps/gmail/routing`],
              ['setup.s6b', `${ADMIN}/apps/gmail/authenticateemail`]],
      // Spelled out to the checkbox: every item here is one whose absence
      // produces mail that arrives but belongs to nobody.
      details: [
        ['h', 'setup.s6h1'],
        ['d', 'setup.s6d1a'], ['d', 'setup.s6d1b', { shared: cfg.shared_account_email || '—' }],
        ['d', 'setup.s6d1c'],
        ['h', 'setup.s6h2'],
        ['d', 'setup.s6d2a'], ['d', 'setup.s6d2b'], ['d', 'setup.s6d2c'],
        ['d', 'setup.s6d2d'], ['d', 'setup.s6d2e'],
        ['h', 'setup.s6h3'],
        ['d', 'setup.s6d3a'], ['d', 'setup.s6d3b'],
      ] },
    { title: 'setup.s7', help: 'setup.s7help',
      done: Boolean(myAlias) && myAlias !== shared,
      error: myAlias && myAlias === shared ? t('setup.s7clash') : null,
      details: [['h', 'setup.s7h1'], ['d', 'setup.s7d1'], ['d', 'setup.s7d2']] },
  ]

  // The first unfinished step is the one to do now; steps that cannot be
  // verified never claim the marker.
  const current = steps.findIndex((step) => step.done === false)

  const list = el('div')
  steps.forEach((step, i) => {
    const row = el('div', 'step')
    if (step.done === true) row.classList.add('done')
    else if (i === current) row.classList.add('now')

    const badge = el('div', 'step-n')
    if (step.done === true) badge.appendChild(icon('check', 'icon-sm'))
    else badge.textContent = String(i + 1)

    const b = el('div', 'step-b')
    const title = el('div', 'step-t')
    title.appendChild(el('span', null, t(step.title)))
    title.appendChild(el('span', 'step-tag', t(
      step.done === null ? 'setup.manual'
        : step.done ? 'setup.done'
        : i === current ? 'setup.now' : 'setup.todo')))
    b.appendChild(title)
    b.appendChild(el('div', 'help', t(step.help)))
    if (step.error) b.appendChild(el('div', 'step-err', step.error))

    if (step.details) {
      const detail = el('div', 'step-detail')
      for (const [kind, key, params] of step.details) {
        if (kind === 'uri') detail.appendChild(redirectUriRow(data.redirectUri))
        else detail.appendChild(el('div', kind === 'h' ? 'step-dh' : 'step-dd', t(key, params)))
      }
      b.appendChild(detail)
    }

    if (step.links) {
      const links = el('div', 'step-links')
      for (const [label, href] of step.links) {
        const a = el('a', 'step-link', t(label))
        a.href = href
        a.target = '_blank'
        a.rel = 'noopener noreferrer'
        a.prepend(icon('link', 'icon-sm'))
        links.appendChild(a)
      }
      b.appendChild(links)
    }

    row.append(badge, b)
    list.appendChild(row)
  })

  body.appendChild(list)

  // Sending is the one thing labMail cannot provision, so the operator has to
  // be told plainly and repeatedly -- once per member, forever.
  const box = el('div', 'callout')
  const title = el('div', 'callout-t')
  title.append(icon('send', 'icon-sm'), document.createTextNode(t('setup.sendAs')))
  box.appendChild(title)
  for (const key of ['setup.sendAsD1', 'setup.sendAsD2', 'setup.sendAsD3', 'setup.sendAsD4']) {
    const line = el('div', 'step-dd', t(key, { shared: shared || '—' }))
    line.style.position = 'relative'
    box.appendChild(line)
  }
  const links = el('div', 'step-links')
  const open = el('a', 'step-link', t('setup.sendAsOpen'))
  open.href = shared
    ? `https://mail.google.com/mail/u/?authuser=${encodeURIComponent(shared)}#settings/accounts`
    : 'https://mail.google.com/mail/u/0/#settings/accounts'
  open.target = '_blank'
  open.rel = 'noopener noreferrer'
  open.prepend(icon('link', 'icon-sm'))
  links.appendChild(open)
  box.appendChild(links)
  body.appendChild(box)

  card.appendChild(body)
  return card
}

async function renderSettings() {
  const host = $('admin-scroll')
  host.innerHTML = ''
  const wrap = el('div', 'admin-wrap')
  host.appendChild(wrap)
  wrap.appendChild(el('h2', 'admin-h', t('settings.title')))
  wrap.appendChild(el('p', 'admin-sub', t('settings.subtitle')))

  let data
  try { data = await api('/api/admin/settings') }
  catch (err) { wrap.appendChild(stateBlock('empty', t('state.loadFailed'), err.message)); return }
  const cfg = data.settings

  // ── Status ──
  const statusCard = el('div', 'card')
  const statusBody = el('div', 'card-b')
  const line = el('div', 'status-line')
  const dot = el('span', 'status-dot')
  dot.style.background = cfg.connected ? 'var(--ok)' : 'var(--text-3)'
  line.append(dot, el('span', null, t(cfg.connected ? 'settings.connected' : 'settings.disconnected')))
  statusBody.appendChild(line)
  statusBody.appendChild(el('p', 'help', cfg.connected
    ? t('settings.statusDetail', {
        count: data.messageCount,
        last: data.lastSyncedAt || t('settings.never'),
        interval: data.syncIntervalSeconds,
      })
    : t('settings.statusNone')))
  statusCard.appendChild(statusBody)
  wrap.appendChild(statusCard)

  wrap.appendChild(renderSetupGuide(data, cfg))

  // ── Fields ──
  const formCard = el('div', 'card')
  formCard.appendChild(el('div', 'card-h', t('settings.section')))
  const formBody = el('div', 'card-b')
  const fields = el('div', 'grid-fields')

  const SPEC = [
    { key: 'org_domain', label: 'settings.orgDomain', placeholder: 'example.com, second.example',
      help: 'settings.orgDomainHelp' },
    { key: 'shared_account_email', label: 'settings.sharedAccount', placeholder: 'shared@example.com',
      help: 'settings.sharedAccountHelp' },
    { key: 'google_client_id', label: 'settings.clientId',
      placeholder: '...apps.googleusercontent.com', help: 'settings.clientIdHelp' },
    { key: 'google_client_secret', label: 'settings.clientSecret', secret: true,
      help: 'settings.clientSecretHelp' },
    { key: 'sync_interval_seconds', label: 'settings.syncInterval', placeholder: '60',
      help: 'settings.syncIntervalHelp' },
    { key: 'undo_send_seconds', label: 'settings.undoSeconds', placeholder: '10',
      help: 'settings.undoSecondsHelp' },
    { key: 'mail_client_host', label: 'settings.mailHost', placeholder: 'mail.example.com',
      help: 'settings.mailHostHelp' },
    { key: 'mail_client_imap_port', label: 'settings.mailImapPort', placeholder: '993',
      help: 'settings.mailPortHelp' },
    { key: 'mail_client_smtp_port', label: 'settings.mailSmtpPort', placeholder: '465',
      help: 'settings.mailPortHelp' },
  ]

  const inputs = {}
  for (const spec of SPEC) {
    const group = el('div')
    group.appendChild(el('label', null, t(spec.label)))
    const input = el('input')
    if (spec.secret) {
      input.type = 'password'
      input.placeholder = t(cfg[spec.key] ? 'settings.secretSet' : 'settings.secretUnset')
    } else {
      input.value = cfg[spec.key] || ''
      input.placeholder = spec.placeholder || ''
    }
    group.appendChild(input)
    group.appendChild(el('div', 'help', t(spec.help)))
    fields.appendChild(group)
    inputs[spec.key] = input
  }
  formBody.appendChild(fields)

  const msgHost = el('div')
  msgHost.style.marginTop = '14px'
  formBody.appendChild(msgHost)

  const buttons = el('div')
  buttons.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-top:16px'

  const save = el('button', 'primary', t('settings.save'))
  save.onclick = () => withBusy(save, t('settings.saving'), async () => {
    try {
      const payload = {}
      for (const [key, input] of Object.entries(inputs)) {
        if (input.value.trim()) payload[key] = input.value.trim()
      }
      await api('/api/admin/settings', { method: 'POST', body: JSON.stringify(payload) })
      toast(t('toast.saved'))
      renderSettings()
    } catch (err) { notice(msgHost, err.message) }
  })

  const connect = el('button', 'bordered', t(cfg.connected ? 'settings.reconnect' : 'settings.connect'))
  connect.onclick = () => {
    if (!cfg.google_client_id || !cfg.google_client_secret) {
      notice(msgHost, t('settings.needClient'))
      return
    }
    // Never resolves: the page is leaving. The spinner covers the wait for
    // Google to answer, which on a slow link is several seconds of nothing.
    void withBusy(connect, t('settings.opening'), () => new Promise(() => {}))
    window.location.href = '/api/admin/oauth/start'
  }
  buttons.append(save, connect)

  if (cfg.connected) {
    const sync = el('button', 'bordered', t('settings.syncNow'))
    sync.onclick = () => withBusy(sync, t('settings.syncing'), async () => {
      try {
        const r = await api('/api/sync', { method: 'POST' })
        toast(t('toast.synced', { n: r.changed })); renderSettings()
      } catch (err) { notice(msgHost, err.message) }
    })
    const off = el('button', 'bordered', t('settings.disconnect'))
    off.classList.add('danger-text')
    off.onclick = async () => {
      if (!await askConfirm(t('settings.disconnectConfirm'), { danger: true })) return
      await withBusy(off, t('settings.disconnecting'), async () => {
        try {
          await api('/api/admin/oauth/disconnect', { method: 'POST' })
          toast(t('toast.disconnected'))
          renderSettings()
        } catch (err) { notice(msgHost, err.message) }
      })
    }
    buttons.append(sync, off)
  }
  formBody.appendChild(buttons)
  formCard.appendChild(formBody)
  wrap.appendChild(formCard)

  // ── Operator's own address ──
  // Shown once an address exists too, not only before: an address that turns
  // out to belong to another Workspace user has to be correctable.
  if (cfg.org_domain) {
    const current = S.me.alias || ''
    const meCard = el('div', 'card')
    meCard.appendChild(el('div', 'card-h', t('settings.myAddress')))
    const meBody = el('div', 'card-b')
    meBody.appendChild(el('p', 'help',
      t(current ? 'settings.myAddressChangeHelp' : 'settings.myAddressHelp')))
    if (current) {
      const now = el('div', 'help')
      now.style.marginTop = '8px'
      now.append(el('span', null, t('settings.myAddressNow') + ' '), el('strong', null, current))
      meBody.appendChild(now)
    }
    const msg = el('div')
    msg.style.marginTop = '10px'
    meBody.appendChild(msg)
    const row = el('div')
    row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-top:10px;max-width:420px'
    const local = el('input')
    local.placeholder = 'admin'
    local.value = current.split('@')[0] || S.me.username.split('@')[0] || ''
    const domains = (cfg.org_domain || '').split(/[\s,]+/).filter(Boolean)
    // One domain reads as a suffix; several are a choice, since the operator
    // address can sit under a secondary domain like anyone else's.
    let suffix
    if (domains.length > 1) {
      suffix = el('select')
      suffix.style.maxWidth = '200px'
      for (const domain of domains) {
        const option = el('option', null, `@${domain}`)
        option.value = domain
        if (current.endsWith(`@${domain}`)) option.selected = true
        suffix.appendChild(option)
      }
    } else {
      suffix = el('span', 'help', `@${domains[0] ?? ''}`)
      suffix.style.whiteSpace = 'nowrap'
    }
    const chosenDomain = () => (suffix.value ?? domains[0] ?? '')
    const setBtn = el('button', 'primary', t(current ? 'settings.change' : 'settings.assign'))
    setBtn.onclick = async () => {
      const next = `${local.value.trim().toLowerCase()}@${chosenDomain()}`
      if (next === current) { notice(msg, t('settings.addressUnchanged'), 'warn'); return }
      if (current && !await askConfirm(t('settings.changeAddressConfirm', { from: current, to: next }))) return
      notice(msg, '')
      await withBusy(setBtn, t('settings.provisioning'), async () => {
      try {
        const r = await api('/api/admin/self-alias', {
          method: 'POST',
          body: JSON.stringify({ localPart: local.value, domain: chosenDomain() }),
        })
        S.me.alias = r.alias
        $('me-mail').textContent = r.alias
        // The address is recorded either way; sending is what may still be
        // missing, and saying so beats a success toast over a half-done job.
        if (r.sendAsError) await showAlert(t('settings.aliasNoSendAs', { alias: r.alias }))
        else toast(t('toast.aliasSet', { alias: r.alias }))
        renderSettings()
      } catch (err) { notice(msg, err.message) }
      })
    }
    row.append(local, suffix, setBtn)
    meBody.appendChild(row)
    meCard.appendChild(meBody)
    wrap.appendChild(meCard)
  }
}

/**
 * Live availability for the requested address. Debounced, and each reply is
 * checked against the value still in the field.
 */
let addressCheckTimer = null
function checkAddressAvailability() {
  const field = $('su-local')
  const msg = $('su-local-msg')
  const value = field.value.trim().toLowerCase()
  clearTimeout(addressCheckTimer)

  if (!value) { msg.textContent = ''; msg.className = 'help'; return }
  msg.textContent = t('auth.checking')
  msg.className = 'help'

  addressCheckTimer = setTimeout(async () => {
    try {
      const domain = $('su-domain').value
      const r = await api(`/api/signup/available?localPart=${encodeURIComponent(value)}`
        + (domain ? `&domain=${encodeURIComponent(domain)}` : ''))
      if ($('su-local').value.trim().toLowerCase() !== value) return
      msg.textContent = r.available ? t('auth.available') : r.reason
      msg.className = r.available ? 'help field-ok' : 'help field-bad'
    } catch (err) {
      if ($('su-local').value.trim().toLowerCase() !== value) return
      msg.textContent = err.message
      msg.className = 'help field-bad'
    }
  }, 350)
}
$('su-local').addEventListener('input', checkAddressAvailability)

function checkPasswordMatch() {
  const msg = $('su-pass-msg')
  const a = $('su-pass').value
  const b = $('su-pass2').value
  if (!b) { msg.textContent = ''; msg.className = 'help'; return true }
  const same = a === b
  msg.textContent = same ? '' : t('auth.passwordMismatch')
  msg.className = same ? 'help' : 'help field-bad'
  return same
}
$('su-pass').addEventListener('input', checkPasswordMatch)
$('su-pass2').addEventListener('input', checkPasswordMatch)

$('form-signup').onsubmit = async (e) => {
  e.preventDefault()
  notice($('auth-notice'), '')
  if (!checkPasswordMatch()) {
    notice($('auth-notice'), t('auth.passwordMismatch'))
    $('su-pass2').focus()
    return
  }
  const btn = e.target.querySelector('button[type=submit]')
  btn.disabled = true
  try {
    const result = await api('/api/signup', {
      method: 'POST',
      body: JSON.stringify({
        displayName: $('su-name').value,
        localPart: $('su-local').value,
        domain: $('su-domain').value || undefined,

    $('form-signup').reset()
    $('su-local-msg').textContent = ''
    $('su-pass-msg').textContent = ''
    $('go-login').click()
    notice($('auth-notice'), result.message, 'ok')
  } catch (err) {
    notice($('auth-notice'), err.message)
  } finally { btn.disabled = false }
}

/**
 * Server-sent events, so mail announces itself instead of waiting for a click.
 *
 * The stream carries only a count; everything shown is re-read through the
 * ordinary endpoints, which is what keeps the ownership checks in the path.
 */
let mailStream = null

async function refreshCounts() {
  const state = await api('/api/me').catch(() => null)
  if (!state) return
  S.connected = Boolean(state.connected)
  S.counts = state.counts || {}
  // Sending opens and closes outside the browser, so it is re-read here
  // rather than only at sign-in.
  if (state.user) S.me = state.user
  paintCounts()
  paintSendGate()
}

function notifyDesktop(text) {
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return
  try {
    const n = new Notification('labMail', { body: text, tag: 'labmail-new-mail', renotify: false })
    n.onclick = () => { window.focus(); selectMailbox('inbox') }
  } catch { /* some browsers refuse outside a service worker; the toast still shows */ }
}

function startMailStream() {
  if (mailStream || !S.me?.alias || typeof EventSource === 'undefined') return
  mailStream = new EventSource('/api/events')
  mailStream.addEventListener('mail', async (e) => {
    let count = 1
    try { count = JSON.parse(e.data).count || 1 } catch { /* keep the default */ }
    await refreshCounts()
    void refreshUnassignedBadge()
    const text = t('live.newMail', { n: count })
    // Already looking at the inbox: refresh it in place rather than nag.
    if (S.view === 'mail' && S.mailbox === 'inbox' && !S.openId && !S.query) {
      loadList()
      toast(text)
    } else {
      toast(text, t('live.open'), () => selectMailbox('inbox'))
    }
    notifyDesktop(text)
  })
  // EventSource reconnects on its own; a logged-out stream 401s and stops.
  mailStream.onerror = () => {}
}

function stopMailStream() {
  if (!mailStream) return
  mailStream.close()
  mailStream = null
}

async function enterApp() {
  $('auth').classList.add('hidden')
  $('app').classList.remove('hidden')

  $('me-name').textContent = S.me.displayName
  $('me-mail').textContent = S.me.alias || t('settings.secretUnset')
  const slot = $('me-avatar')
  slot.replaceWith(Object.assign(avatarFor(S.me.displayName, S.me.alias || S.me.username),
    { id: 'me-avatar' }))

  $('admin-nav').classList.toggle('hidden', !S.me.isAdmin)
  paintLanguageButtons()

  const state = await api('/api/me').catch(() => ({}))
  S.connected = Boolean(state.connected)
  S.counts = state.counts || {}
  if (state.user) S.me = state.user
  paintCounts()
  paintSendGate()
  connectionBanner(S.connected)

  // The address bar decides the view, so a reload stays put.
  await applyPath({ initial: true })

  void refreshUnassignedBadge()

  if (S.me.alias) {
    void loadCategories()
    startMailStream()
    // Asked once, right after a deliberate sign-in, so the prompt has context.
    if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
      Notification.requestPermission().catch(() => {})
    }
  }

  // Restore a draft left by a crash or stray close.
  const draft = loadDraft()
  if (draft && (draft.to || draft.subject || draft.html || draft.body)) {
    const age = Date.now() - (draft.savedAt || 0)
    if (age < 7 * 86400000) {
      toast(t('toast.draftWaiting'), t('toast.resumeDraft'), () => {
        openCompose({
          title: t('compose.draftTitle'), to: draft.to, cc: draft.cc,
          subject: draft.subject,
          html: draft.html ?? textToEditorHtml(draft.body || ''),
          replyTo: draft.replyTo,
        })
        $('c-bcc').value = draft.bcc || ''
        if (draft.cc) $('c-cc-row').classList.remove('hidden')
      })
    } else { dropDraft() }
  }
}

;(async () => {
  translateStatic()
  applyTheme()
  paintLanguageButtons()

  try {
    const cfg = await api('/api/config')
    // Suffix shown only when the domain is known.
    const domains = cfg.orgDomains ?? []
    // A single domain is a suffix, not a decision. More than one has to be
    // asked, because the same local part is a different person under each.
    if (domains.length === 1) {
      $('su-suffix').textContent = `@${domains[0]}`
    } else if (domains.length > 1) {
      $('su-suffix').classList.add('hidden')
      const select = $('su-domain')
      select.classList.remove('hidden')
      for (const domain of domains) {
        const option = el('option', null, `@${domain}`)
        option.value = domain
        select.appendChild(option)
      }
      select.onchange = () => checkAddressAvailability()
    } else {
      $('su-suffix').classList.add('hidden')
    }
  } catch { $('su-suffix').classList.add('hidden') }

  try {
    const { user, connected, counts } = await api('/api/me')
    if (user) {
      S.me = user
      S.connected = Boolean(connected)
      S.counts = counts || {}
      await enterApp()
      if (new URLSearchParams(location.search).get('connected')) {
        history.replaceState({}, '', '/')
        toast(t('toast.connected'))
        if (S.me.isAdmin) openView('settings')
      }
      return
    }
  } catch { /* fall through to the sign-in screen */ }
  $('li-user').focus()
})()
</script>
</body>
</html>
