name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: labmail:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and serves health check
        run: |
          docker run -d --name labmail-ci \
            -e ADMIN_PASSWORD=ci-test-password-1234 \
            -p 8000:8000 labmail:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz; then echo; exit 0; fi
            sleep 1
          done
          echo "service did not become healthy"
          docker logs labmail-ci
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f labmail-ci || true
