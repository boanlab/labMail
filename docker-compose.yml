services:
  labmail:
    build: .
    image: labmail:latest
    container_name: labmail
    restart: unless-stopped
    env_file: .env
    ports:
      # Same port on both sides: PORT is passed into the container through
      # env_file, so a mapping with a fixed container port would break the
      # moment PORT was changed.
      #
      # Bound to all interfaces so the service is reachable at the host's IP.
      # Put a TLS-terminating proxy in front before exposing it beyond the LAN:
      # session cookies are sent over plain HTTP as configured here.
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      # Mail mirror, credentials and accounts. This is the thing to back up,
      # and the thing to protect — it contains the organization's mail in the clear.
      - labmail-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  labmail-data:
